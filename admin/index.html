<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sapna Admin">
<meta name="robots" content="noindex">
<title>Sapna Health Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--bg2:#121218;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--solid:#17171e;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--text:#f5f3ef;--muted:#a9a6b0;--faint:#7c7984;--coral:#ff7a59;--lime:#c6f432;--amber:#ffb224;--pink:#ff6fae;--cyan:#4fd1ff;--danger:#ff6b6b;--ok:#4ade80;--acc:var(--coral);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f2ee;--bg2:#ebe8e2;--card:#fff;--card2:#f0ede7;--solid:#fff;--line:rgba(20,18,24,.09);--line2:rgba(20,18,24,.18);--text:#141218;--muted:#5e5a66;--faint:#7d7985;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 110px)}
h1{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;font-size:clamp(32px,6vw,44px);line-height:1.02;margin:0}
h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.faint{color:var(--faint)}
.big{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrapr{flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g2{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:none;background:var(--acc);color:#0c0c10;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn:disabled{opacity:.45}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.input,select.input,textarea.input{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:0 12px;width:100%}
textarea.input{padding:10px 12px;min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--acc)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:calc(var(--st) + 8px) 0 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -16px 14px;padding-left:16px;padding-right:16px}
.tabs button{min-height:42px;border:none;border-radius:12px;background:var(--card2);color:var(--muted);font-weight:700;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--acc);color:#0c0c10}
[hidden]{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:transparent;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#0c0c10}
.ex{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;padding:0}
.ex img,.ex .ph{width:100%;height:120px;object-fit:cover;background:#fff;display:block}
.ex .ph{background:var(--card2)}
.ex .t{padding:8px 10px;font-size:13px;font-weight:600;line-height:1.25}
.ex.on{border:2px solid var(--acc)}
.move{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.move img,.move .noimg{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#fff}.move .noimg{display:flex;align-items:center;justify-content:center;background:var(--card2);font-size:22px;color:var(--acc)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;grid-column:1/-1}
.move .yt{grid-column:1/-1;font-size:13px}.move .yt input{min-height:40px}
.nums input,.nums select{min-height:40px;text-align:center;padding:0 4px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px}td{padding:9px 6px;border-top:1px solid var(--line)}
.pub{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);z-index:20;max-width:956px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:20px;background:color-mix(in srgb,var(--solid) 90%,transparent);border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.pub[hidden]{display:none}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:980px;max-height:90vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:16px 16px calc(var(--sb) + 22px);border-top:1px solid var(--line2)}
.pill{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* ---------- Phone layout ---------- */
@media (max-width: 640px) {
  h1 { font-size: 32px; }
  .card { padding: 14px; border-radius: 18px; }
  .dash .grid .card .big { font-size: 26px !important; }
  .dash .grid .card { padding: 12px 14px; }
  .dash .grid .card p + .big { margin-top: 6px; }
  /* iOS zooms into inputs smaller than 16px — keep them 16px */
  .input, select.input, textarea.input { font-size: 16px; }
  .mono { font-size: 13px !important; }
  .pub { left: 8px; right: 8px; padding: 10px 10px 10px 14px; }
  .pub #pubSub { display: none; }
  .modal .sheet { max-height: 92vh; }
}

.warn{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 8%,var(--card))}
.chart{display:flex;flex-direction:column;gap:6px}.ctip{margin:0;min-height:19px}.ctip.on{color:var(--text);font-weight:700}
.cplot{position:relative;height:150px;border-bottom:1px solid var(--line2)}
.cbars{position:absolute;inset:0;display:grid;gap:2px;align-items:end}
.cbar{display:block;width:100%;border:none;padding:0;border-radius:4px 4px 0 0;background:var(--acc);min-height:2px;position:relative}
.cbar::after{content:'';position:absolute;inset:-10px -1px 0}
.cbar.zero{background:var(--card2)}.cbar.over{background:var(--danger)}.cbar.sel{outline:2px solid var(--text);outline-offset:1px}
.cbar:hover{filter:brightness(1.15)}
.cgoal{position:absolute;left:0;right:0;border-top:2px dashed var(--line2);pointer-events:none;z-index:1}
.cgoal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted);background:var(--bg2);padding:0 4px;border-radius:4px}
.clabels{display:grid;gap:2px;font-size:11px;color:var(--faint);text-align:left;white-space:nowrap;overflow:visible}
.clabels span{overflow:visible}
.wchart{width:100%;height:auto}.wchart .grid{stroke:var(--line);stroke-width:1}.wchart .axis{fill:var(--muted);font-size:10px}
.sess{border-top:1px solid var(--line);padding:10px 0 2px}.sess summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;list-style:none}.sess summary::-webkit-details-marker{display:none}
.mrow{display:grid;grid-template-columns:84px 1fr 38px;gap:10px;align-items:center}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--danger);font-weight:700}
.trow{cursor:pointer}.trow:hover td{background:var(--card2)}
.ib:disabled{opacity:.35}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}.steps a{color:var(--acc)}
.qr{background:#fff;border-radius:16px;padding:10px;align-self:center;width:min(300px,100%)}.qr svg{display:block;width:100%;height:auto}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:96px;word-break:break-all}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok);vertical-align:1px}
/* ---------- Layout v2: Today / Progress / Workouts / Foods / Settings ---------- */
:root{--gut:16px}
.wrap{padding-left:var(--gut);padding-right:var(--gut)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.hdr h1{font-size:clamp(30px,5vw,40px)}
.hdr .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{margin:0 calc(-1 * var(--gut)) 14px;padding-left:var(--gut);padding-right:var(--gut)}
.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.tabs .ti{display:inline-flex}.tabs svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.liveline{margin:-6px 0 0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.v-day,.v-foods,.v-workouts{display:block;max-width:720px;margin:0 auto}
/* date strip */
.dstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.dstrip::-webkit-scrollbar{display:none}
.dchip{flex:none;width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:11px;font-weight:700}
.dchip b{font-size:18px;line-height:1.05;color:var(--text);font-family:'Bricolage Grotesque',Figtree,sans-serif}
.dchip i{display:block;width:26px;height:4px;border-radius:99px;background:var(--card2);position:relative;overflow:hidden}
.dchip i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--acc);border-radius:99px}
.dchip i.over::after{background:var(--danger)}
.dchip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#0c0c10}
.dchip[aria-pressed=true] b{color:#0c0c10}.dchip[aria-pressed=true] i{background:rgba(0,0,0,.2)}.dchip[aria-pressed=true] i::after{background:#0c0c10}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text);min-width:0}
button.tile:hover{border-color:var(--line2)}
.tile .v{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:800;font-size:28px;line-height:1;letter-spacing:-.03em}
.tile .v small{font-size:13px;color:var(--muted);font-family:Figtree,sans-serif;font-weight:600;letter-spacing:0}
.tile .bar{height:6px}
.tedit{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:var(--acc)}
/* meals */
.meal{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.fi{display:flex;align-items:center;gap:10px}
.fi .fn{flex:1;min-width:0;display:flex;flex-direction:column}
.fi .fn b{font-weight:600}
.fi .fk{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.fi .fk b{font-weight:700}
.fi .fa{display:flex;gap:4px}
.ib.sm{width:34px;height:34px;border-radius:10px;font-size:14px}
.addb{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);font-weight:700;font-size:13px}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.seg button{min-height:40px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.seg button[aria-pressed=true]{background:var(--solid);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.22)}
.seg .cnt{font-weight:600;color:var(--faint);margin-left:4px}
/* food list */
.searchbar{position:sticky;top:calc(var(--st) + 66px);z-index:6;background:var(--bg);padding:6px 0;margin:-6px 0}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:none;border-top:1px solid var(--line);background:transparent;color:var(--text);text-align:left;min-height:62px}
.list>.lrow:first-child,.list>.letter:first-child{border-top:none}
.lrow:hover{background:var(--card2)}.lrow:disabled{cursor:default}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lmain b{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lk{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.lk b{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-size:20px;font-weight:800;line-height:1.05}
.chev{flex:none;color:var(--faint);font-size:22px;line-height:1}
.chg .lmain b::after{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-left:7px;vertical-align:2px}
.letter{margin:0;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);background:var(--card2);border-top:1px solid var(--line)}
mark{background:color-mix(in srgb,var(--acc) 32%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.flash{animation:flash 2s ease}
@keyframes flash{0%,45%{background:color-mix(in srgb,var(--acc) 24%,transparent)}100%{background:transparent}}
.g3{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
/* workouts week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 3px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;min-height:78px;text-align:center}
.wday b{font-size:11.5px;color:var(--text);font-weight:600;line-height:1.2;letter-spacing:0;text-transform:none;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.wday.set{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 9%,var(--card))}
.wday.now{box-shadow:inset 0 0 0 2px var(--acc)}
.wday:disabled{opacity:1;cursor:default}.wday:disabled b{color:var(--faint)}
.plan{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
/* progress + settings grids */
.pgrid{display:grid;gap:14px}
.setgrid{display:grid;gap:22px}
@media (min-width:900px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pgrid .full{grid-column:1/-1}.setgrid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.sec{margin:0}
@media (max-width:640px){
  :root{--gut:14px}
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;z-index:30;gap:0;padding:6px 6px calc(var(--sb) + 6px);border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent)}
  .tabs button{flex-direction:column;gap:3px;font-size:11px;min-height:54px;background:transparent;padding:0;color:var(--muted)}
  .tabs button[aria-pressed=true]{background:transparent;color:var(--text)}
  .tabs .ti{padding:3px 16px;border-radius:99px}
  .tabs button[aria-pressed=true] .ti{background:color-mix(in srgb,var(--acc) 26%,transparent);color:var(--acc)}
  .wrap{padding-top:calc(var(--st) + 12px);padding-bottom:calc(var(--sb) + 160px)}
  .pub{bottom:calc(var(--sb) + 76px)}
  .searchbar{top:var(--st)}
  .dstrip{margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 4px}
  .hdr h1{font-size:30px}
  .tile .v{font-size:25px}
  .g3 .f{font-size:12px}
  .modal{z-index:50}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pub" id="pub" hidden>
  <div style="flex:1;min-width:0"><strong id="pubTitle">Unpublished changes</strong><div class="small muted" id="pubSub">Sapna's app picks them up next time it opens.</div></div>
  <button class="btn" id="pubBtn" type="button">Publish</button>
</div>
<script type="module">
/* Sapna Health admin — static page, runs entirely in Rishu's browser.
   Publishes plans/foods/targets to content/content.json in the public repo.
   Never touches Sapna's personal data; her reports are opened locally only. */
const REPO = { owner: 'drishabhh', name: 'sapna-app-and-admin', branch: 'main' };
const CONTENT_PATH = 'content/content.json';
const LIB_URL = '../data/gif-library.json';
const SITE = 'https://drishabhh.github.io/sapna-app-and-admin/';
const LS_TOKEN = 'sapna_admin_gh_token';
const LS_REPORT = 'sapna_admin_last_report';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'item';
const gif = (g) => (!g ? '' : /^https:/.test(g) ? g : SITE + g.replace(/^\.?\//, ''));

let S = { token: '', content: null, sha: null, dirty: false, tab: 'status', lib: null, report: null, editing: null, picker: null, libQ: '', libPart: 'all', libGroup: 'exercises', foodQ: '' };
// "Link another device": #link=<base64url {v,t,s}> carries the admin token + sync settings.
// It's in the #fragment, so it never leaves this browser (not sent to GitHub Pages).
(() => {
  const m = location.hash.match(/^#link=([A-Za-z0-9_-]+)/);
  if (!m) return;
  try {
    const bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((m[1].length + 3) % 4));
    const j = JSON.parse(decodeURIComponent(escape(bin)));
    if (j.t) localStorage.setItem('sapna_admin_gh_token', j.t);
    if (j.s && j.s.k) localStorage.setItem('sapna_admin_sync_v1', JSON.stringify(j.s));
    if (j.f && j.f.private_key) localStorage.setItem('sapna_admin_fcm_sa', JSON.stringify(j.f));

function normReport(r) {
  const T = r.targets || S.content?.targets || { kcal: 1300, protein: 100, water: 8 };
  let food = [], water = {}, steps = {}, sessions = [];
  const daily = {};
  const day = (k) => daily[k] || (daily[k] = { kcal: 0, protein: 0, items: 0 });
  if ((r.v || 1) >= 2) {
    food = r.food || []; water = r.water || {}; steps = r.steps || {}; sessions = r.sessions || [];
    food.forEach((f) => { const x = day(f.date); x.kcal += f.kcal || 0; x.protein += f.protein || 0; x.items++; });
  } else {
    (r.days || []).forEach((d) => {

      const x = day(d.date); x.kcal = d.kcal; x.protein = d.protein;
      MEAL_ORDER.forEach((m) => (d.meals?.[m] || []).forEach((n) => { food.push({ date: d.date, meal: m, name: n }); x.items++; }));

  }

}

/* --- Push to her phone (Firebase Cloud Messaging) ---
   Default route: GitHub workflow "Push to Sapna" (holds the Firebase key as a secret; ~15–30 s).
   Optional instant route: the service-account key pasted here (stays in this browser; ~1 s). */
const LS_FCM = 'sapna_admin_fcm_sa';
const LS_AUTOPUSH = 'sapna_admin_autopush';
const fcmSa = () => { try { return JSON.parse(localStorage.getItem(LS_FCM) || 'null'); } catch { return null; } };
const autoPush = () => { try { return localStorage.getItem(LS_AUTOPUSH) !== '0'; } catch { return true; } };
function herPush() { const r = S.syncReport || S.report; return r && r.push && r.push.token ? r.push : null; }

async function fcmDirect(sa, msg) {
  const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const now = Math.floor(Date.now() / 1000);
  const unsigned = enc({ alg: 'RS256', typ: 'JWT' }) + '.' + enc({ iss: sa.client_email, scope: 'https://www.googleapis.com/auth/firebase.messaging', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 });
  const der = Uint8Array.from(atob(sa.private_key.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '')), (c) => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(unsigned)));
  const jwt = unsigned + '.' + b64u(sig);
  const tr = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }) });
  const tj = await tr.json(); if (!tr.ok) throw new Error('Google sign-in failed: ' + (tj.error_description || tj.error));
  const r = await fetch(`https://fcm.googleapis.com/v1/projects/${sa.project_id}/messages:send`, { method: 'POST', headers: { Authorization: `Bearer ${tj.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(msg) });
  const rj = await r.json().catch(() => ({})); if (!r.ok) throw new Error('FCM: ' + (rj.error?.message || r.status));
}

/** Returns 'instant' | 'queued'. Throws with a readable message. */
async function sendPush(title, body, data = {}) {
  const p = herPush();
  if (!p) throw new Error('Her phone hasn’t registered for notifications yet — she needs app 1.7 and to open it once with live sync on.');
  const strData = Object.fromEntries(Object.entries(data).map(([k, v]) => [k, String(v)]));
  const sa = fcmSa();
  if (sa) {
    try {
      await fcmDirect(sa, { message: { token: p.token, notification: { title, body }, data: strData, android: { priority: 'HIGH', notification: { channel_id: 'rishu', icon: 'ic_stat_sapna', color: '#FF7A59', sound: 'default' } } } });
      return 'instant';
    } catch (e) { console.warn('Instant push failed, using GitHub route:', e.message); }
  }
  await gh('dispatches', { method: 'POST', body: JSON.stringify({ event_type: 'sapna-push', client_payload: { token: p.token, title, body, data: strData } }) });
  return 'queued';
}

/* --- Edit her data from here (two-way) ---
   Edits become small encrypted ops in admin-ops.enc.json on the `admin` branch of the private
   sync repo (her phone force-pushes `main`, so the ops never get wiped). Her app applies them
   (on open, every 20 s while open, pull-to-refresh) and lists applied ids in report.adminAck. */
const ADMIN_BRANCH = 'admin';
const ADMIN_FILE = 'admin-ops.enc.json';
const DIETS = { veg: 'Vegetarian', egg: 'Eggetarian', non: 'Non-veg' };
const GOALS = { lose: 'Lose fat', strong: 'Get strong', energy: 'More energy', keep: 'Stay fit' };
const REMS = { punch: '7:10 am gym punch line', meals: 'Meal reminders', water: 'Water', gym: 'Workout days', weigh: 'Weekly weigh-in', steps: '11:30 pm steps' };
if (!S.remoteOps) S.remoteOps = [];

async function decryptEnv(text, k) {
  const env = JSON.parse(text);
  const key = await crypto.subtle.importKey('raw', unb64u(k), 'AES-GCM', false, ['decrypt']);
  let bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(env.iv) }, key, unb64u(env.ct)));
  if (env.z) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function encryptEnv(obj, k) {
  const key = await crypto.subtle.importKey('raw', unb64u(k), 'AES-GCM', false, ['encrypt']);
  let data = new TextEncoder().encode(JSON.stringify(obj)); let z = false;
  if (typeof CompressionStream !== 'undefined') { data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); z = true; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data));
  return JSON.stringify({ type: 'sapna-sync', v: 1, alg: 'A256GCM', z, iv: b64u(iv), ct: b64u(ct), at: new Date().toISOString() });
}
async function syncApi(c, path, method, body) {
  const res = await fetch(`https://api.github.com/repos/${c.o}/${c.r}${path}`, { method, headers: { Authorization: `Bearer ${c.t}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(j.message || `GitHub ${res.status}`); e.status = res.status; throw e; }
  return j;
}
async function fetchOps(c) {
  const r = await syncGh(c, `/contents/${ADMIN_FILE}?ref=${ADMIN_BRANCH}&t=${Date.now()}`, 'application/vnd.github.raw');
  if (r.status === 404) return [];
  if (!r.ok) return null;
  try { const j = await decryptEnv(await r.text(), c.k); return j && Array.isArray(j.ops) ? j.ops : []; } catch { return null; }
}
async function writeOps(c, ops) {
  const text = await encryptEnv({ type: 'sapna-ops', v: 1, ops }, c.k);
  const blob = await syncApi(c, '/git/blobs', 'POST', { content: text, encoding: 'utf-8' });
  const tree = await syncApi(c, '/git/trees', 'POST', { tree: [{ path: ADMIN_FILE, mode: '100644', type: 'blob', sha: blob.sha }] });
  const commit = await syncApi(c, '/git/commits', 'POST', { message: 'admin edits', tree: tree.sha, parents: [] });
  try { await syncApi(c, `/git/refs/heads/${ADMIN_BRANCH}`, 'PATCH', { sha: commit.sha, force: true }); }
  catch (e) { if (e.status === 404 || e.status === 422) await syncApi(c, '/git/refs', 'POST', { ref: `refs/heads/${ADMIN_BRANCH}`, sha: commit.sha }); else throw e; }
}
const ackSet = () => new Set((S.syncReport && S.syncReport.adminAck) || []);
function pendingOps() { const a = ackSet(); return (S.remoteOps || []).filter((o) => !a.has(o.id)); }
const newOpId = () => 'op_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);

async function queueOps(ops, msg = 'Sent — applies on her phone within ~20 s while the app is open, otherwise when she opens it') {
  const c = syncCfg(); if (!c) return toast('Set up live sync first');
  const stamped = ops.map((o) => ({ id: newOpId(), at: Date.now(), ...o }));
  const next = [...pendingOps(), ...stamped];
  try { await writeOps(c, next); }
  catch (e) {
    if (e.status === 401 || e.status === 403) { try { await writeOps({ ...c, t: S.token }, next); } catch (e2) { return toastLong('Couldn’t send the change: ' + e2.message); } }
    else return toastLong('Couldn’t send the change: ' + e.message);
  }
  S.remoteOps = next; const y = scrollY; render(); scrollTo(0, y); toast(msg);
}
async function undoOp(id) {
  const c = syncCfg(); if (!c) return;
  const next = pendingOps().filter((o) => o.id !== id);
  try { await writeOps(c, next); S.remoteOps = next; const y = scrollY; render(); scrollTo(0, y); toast('Change cancelled'); }
  catch (e) { toastLong('Couldn’t cancel: ' + e.message); }
}

/** Show pending edits immediately on the dashboard (marked ⏳ until her phone confirms). */
function overlayReport(r) {
  const ops = pendingOps(); if (!ops.length || !r || (r.v || 1) < 2) return r;
  const o = { ...r, food: (r.food || []).map((x) => ({ ...x })), water: { ...(r.water || {}) }, steps: { ...(r.steps || {}) }, weighIns: [...(r.weighIns || [])], sessions: [...(r.sessions || [])], profile: { ...(r.profile || {}) }, reminders: { ...(r.reminders || {}) } };
  for (const op of [...ops].sort((a, b) => a.at - b.at)) {
    if (op.kind === 'food.upsert') { const e = op.entry; const ex = o.food.find((f) => f.id === e.id); if (ex) Object.assign(ex, e, { _p: true }); else o.food.push({ ...e, _p: true }); }
    else if (op.kind === 'food.delete') o.food = o.food.filter((f) => f.id !== op.foodId);
    else if (op.kind === 'water.set') { if (op.value) o.water[op.date] = op.value; else delete o.water[op.date]; }
    else if (op.kind === 'steps.set') { if (op.value) o.steps[op.date] = op.value; else delete o.steps[op.date]; }
    else if (op.kind === 'weigh.set') { o.weighIns = o.weighIns.filter((w) => w.date !== op.date); if (op.kg !== null) o.weighIns.push({ date: op.date, kg: op.kg }); }
    else if (op.kind === 'session.delete') o.sessions = o.sessions.filter((s) => s.id !== op.sessionId);
    else if (op.kind === 'profile.patch') { Object.assign(o.profile, op.patch); if (op.patch.goal) o.goal = op.patch.goal; if (op.patch.name) o.name = op.patch.name; }
    else if (op.kind === 'reminders.patch') Object.assign(o.reminders, op.patch);
    else if (op.kind === 'customFood.upsert') { o.customFoods = [...(o.customFoods || []).filter((x) => x.id !== op.food.id), { ...op.food, _p: true }]; }
    else if (op.kind === 'customFood.delete') o.customFoods = (o.customFoods || []).filter((x) => x.id !== op.foodId);

      <label class="f">Name<input class="input" name="nname" placeholder="e.g. Besan chilla"></label>
      <div class="g2"><label class="f">Portion<input class="input" name="nportion" value="1 serving"></label><label class="f">Calories (per portion)<input class="input" name="nkcal" inputmode="numeric"></label></div>
      <label class="f">Protein g (per portion)<input class="input" name="nprot" inputmode="decimal" value="0"></label>
      <label class="row" style="gap:10px"><input type="checkbox" name="nsave" checked style="width:20px;height:20px"> <span style="font-weight:500">Also save to her foods (she can search it)</span></label>
      <button class="btn ghost" type="button" data-usenew>Use this food</button></div></details>`, (m, close) => {

    let shown = [];

      const q = g('q').value.trim().toLowerCase();
      if (!q) { shown = recents.length ? recents : lib.slice(0, 10); list.innerHTML = `<p class="eyebrow">${recents.length ? 'Her usual' : 'Library'}</p>` + shown.map((f, i) => row(f, i, recents.length ? f.n + '×' : '')).join(''); }
      else { const ws = q.split(/\s+/); shown = lib.filter((f) => ws.every((w) => f.name.toLowerCase().includes(w))).slice(0, 20); list.innerHTML = shown.map((f, i) => row(f, i, f.hers ? 'hers' : '')).join('') || '<p class="small muted">No match — create it below.</p>'; }
      list.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => choose(shown[+b.dataset.pick])));
    };
    const total = () => ({ kcal: Math.round(pick.kcal * mult), protein: Math.round((pick.protein || 0) * mult * 10) / 10 });
    const drawPick = () => {
      const t = total();
      picked.hidden = false;
      picked.innerHTML = `<div class="between"><strong style="font-size:18px">${esc(pick.name)}</strong><button class="ib" type="button" data-unpick aria-label="Change food">✕</button></div>
        <p class="small muted">1 = ${esc(pick.portion || '1 serving')} · ${pick.kcal} kcal</p>
        <div class="chips">${[0.5, 1, 1.5, 2].map((v) => `<button class="chip" type="button" data-mult="${v}" aria-pressed="${mult === v}">${v === 0.5 ? '½' : v === 1.5 ? '1½' : v}×</button>`).join('')}
          <input class="input" name="mcustom" inputmode="decimal" value="${[0.5, 1, 1.5, 2].includes(mult) ? '' : mult}" placeholder="other" style="width:90px;min-height:38px"></div>

        <button class="btn" type="button" data-save>Add ${mult === 0.5 ? '½' : mult === 1.5 ? '1½' : mult}× to her ${MEAL_LABEL[g('meal').value].toLowerCase()}</button>`;
      picked.querySelector('[data-unpick]').onclick = () => { pick = null; picked.hidden = true; list.hidden = false; g('q').hidden = false; draw(); };
      picked.querySelectorAll('[data-mult]').forEach((b) => (b.onclick = () => { mult = +b.dataset.mult; drawPick(); }));
      picked.querySelector('[name="mcustom"]').onchange = (e) => { const v = numVal(e.target); if (v && v > 0 && v <= 20) { mult = v; drawPick(); } };
      picked.querySelector('[data-save]').onclick = save;
    };
    const choose = (f) => { pick = f; mult = 1; list.hidden = true; g('q').hidden = true; m.querySelector('[data-new]').open = false; drawPick(); };
    const save = () => {
      const t = total(), ml = g('meal').value;
      const at = day === dkey(new Date()) ? Date.now() : new Date(day + 'T12:00:00').getTime();
      const ops = [];
      if (pick._new && pick._save) ops.push({ kind: 'customFood.upsert', food: { id: pick.id, name: pick.name, portion: pick.portion, kcal: pick.kcal, protein: pick.protein } });
      ops.push({ kind: 'food.upsert', entry: { id: 'rk-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), foodId: pick.id || 'rishu', date: day, meal: ml, name: pick.name, portion: pick.portion || '1 serving', mult, kcal: t.kcal, protein: t.protein, at } });
      close(); queueOps(ops);
    };
    g('meal').onchange = () => { if (pick) drawPick(); };
    g('q').oninput = draw;
    m.querySelector('[data-usenew]').onclick = () => {
      const name = g('nname').value.trim(), kcal = numVal(g('nkcal'));
      if (!name || kcal === null) return toast('Name and calories are needed');
      choose({ _new: true, _save: g('nsave').checked, id: 'custom-rk-' + Date.now().toString(36), name: name.slice(0, 60), portion: g('nportion').value.trim() || '1 serving', kcal: Math.round(kcal), protein: Math.round((numVal(g('nprot')) || 0) * 10) / 10 });
    };
    draw(); g('q').focus();
  });
}

function settingsSheet(r) {

      <label class="f">Diet<select class="input" name="diet">${Object.entries(DIETS).map(([k, l]) => `<option value="${k}" ${p.diet === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
    <div class="f">Gym days<div class="chips" style="margin-top:6px">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d, i) => `<button class="chip" type="button" data-gd="${i}" aria-pressed="${gd.has(i)}">${d}</button>`).join('')}</div></div>

    <button class="btn" type="button" data-save>Save — send to her phone</button>`, (m, close) => {

    m.querySelectorAll('[data-gd]').forEach((b) => (b.onclick = () => { const i = +b.dataset.gd; gd.has(i) ? gd.delete(i) : gd.add(i); b.setAttribute('aria-pressed', gd.has(i)); }));
    m.querySelector('[data-save]').onclick = () => {

      Object.keys(REMS).forEach((k) => { const v = g('r_' + k).checked; if (v !== !!rem[k]) rp[k] = v; });

      const ops = []; if (Object.keys(patch).length) ops.push({ kind: 'profile.patch', patch }); if (Object.keys(rp).length) ops.push({ kind: 'reminders.patch', patch: rp });
      close(); if (ops.length) queueOps(ops); else toast('Nothing changed');
    };
  });
}

  const cf = Object.fromEntries(((m0.r && m0.r.customFoods) || []).map((f) => [f.id, f]));

  document.querySelectorAll('[data-cfadd]').forEach((b) => (b.onclick = () => herFoodSheet(null)));

function vSyncCard(c) {

    ${S.showPair ? `<p class="small muted">Send this to Sapna. In her app: <b>Settings → Live sync with Rishu → paste → Connect</b>. It contains the key to her data — share it only with her.</p>
      <textarea class="input mono" id="pcode" readonly>${esc(code)}</textarea>
      <div class="row wrapr"><button class="btn sm" type="button" id="pcopy">Copy code</button>${navigator.share ? '<button class="btn ghost sm" type="button" id="pshare">Share…</button>' : ''}<button class="btn ghost sm" type="button" id="phide">Hide</button></div>`
      : `<div class="row wrapr"><button class="btn sm" type="button" data-link>Link another device</button><button class="btn ghost sm" type="button" id="pshow">Show pairing code</button><button class="btn ghost sm" type="button" id="supd">Update token</button><button class="btn danger sm" type="button" id="soff">Disconnect this browser</button></div>`}
    ${S.syncTokenDead || S.showUpd ? `<div class="card warn stack" style="gap:8px"><strong>Update the sync token</strong>
      <p class="small muted">Paste the current value of your token that has <b>sapna-sync</b> with Contents: Read and write. Her encryption key stays the same — she just pastes the new code (Settings → Live sync → Paste new code).</p>
      <input class="input" id="sutok" type="password" autocomplete="off" placeholder="github_pat_…">
      <button class="btn sm" type="button" id="susave" style="align-self:flex-start">Check & make new code</button></div>` : ''}
  </div>`;
}
const emergencyFile = () => `<details class="card" data-k="emerg"><summary><strong>Emergency: open a file</strong> <span class="small muted">only if sync isn’t working</span></summary><div class="stack" style="margin-top:10px"><p class="small muted">If she taps “Send my dashboard file” in her app’s Settings and sends it on WhatsApp, open it here. It stays in this browser.</p><label class="btn ghost sm" style="cursor:pointer;align-self:flex-start">Open file<input id="rep" type="file" accept="application/json,text/plain,.json,.txt" class="sr"></label></div></details>`;

const fmtL = (ml) => (ml >= 1000 ? `${Math.round(ml / 10) / 100} L` : `${Math.round(ml)} ml`);
const lastSip = (m, k) => { const ds = ((m.r.drinks || {})[k] || []).filter((x) => x.at); return ds.length ? ` · ${ds.length} drink${ds.length === 1 ? '' : 's'}, last ${new Date(ds.at(-1).at).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })}` : ''; };
/** Her report → everything the Today/Progress/Foods/Settings views need. */
function model() {
  const c = syncCfg(); const rep = currentReport();
  if (!rep) return { c, rep: null };
  const fromSync = rep === S.syncReport;
  const editable = fromSync && !!c && (rep.v || 1) >= 2;
  const m = normReport(editable ? overlayReport(rep) : rep);
  const td = dkey(new Date()); if (editable && m.last < td) m.last = td; // you can always add to today
  if (editable) S._m = m;
  if (!S.dash.day || S.dash.day > m.last || S.dash.day < m.first) S.dash.day = m.last;
  return { c, rep, fromSync, editable, m };
}
function freshness(M) {
  const ageH = (Date.now() - new Date(M.m.r.generatedAt).getTime()) / 3600000;
  const fresh = ageH < 1 ? 'just now' : ageH < 24 ? `${Math.round(ageH)} h ago` : `${Math.round(ageH / 24)} days ago`;
  const stale = ageH > 48 ? `<div class="card warn"><strong>Last update ${Math.round(ageH / 24)} days ago.</strong><p class="small muted">${M.fromSync ? 'Her phone syncs whenever she opens the app — she may not have opened it.' : 'This is an old file.'}${S.sync.status === 'error' ? ' Sync error: ' + esc(S.sync.msg) : ''}</p></div>` : (S.sync.status === 'error' && M.c ? `<div class="card warn small"><strong>Sync problem:</strong> ${esc(S.sync.msg)}</div>` : '');
  const v1 = (M.m.r.v || 1) < 2 ? `<div class="card warn small">Older 7-day file — calories per food item and full history need her app updated to 1.5.3+.</div>` : '';
  const line = `<p class="small muted liveline">${M.fromSync ? '<span class="live"></span>Live from her phone' : 'From a file'} · updated ${fresh}${M.m.r.streaks ? ` · <b>${M.m.r.streaks.logging}</b>-day logging streak` : ''}</p>`;
  return { line, warn: stale + v1 };
}
/** No data yet: first-time setup, waiting for her phone, or a sync error. */
function vNoReport(c) {
  const st = S.sync;
  const msg = !c ? '' : st.status === 'error' ? `<div class="card warn"><strong>Sync problem</strong><p class="small muted">${esc(st.msg)}</p><button class="btn ghost sm" type="button" id="sretry">Try again</button></div>`
    : st.status === 'empty' ? `<div class="card"><strong>Waiting for her phone</strong><p class="small muted">Once she pastes the pairing code in her app (Settings → Live sync with Rishu), her day appears here.</p><button class="btn ghost sm" type="button" id="sretry">Check again</button></div>`
    : `<p class="muted">Loading her day…</p>`;
  if (c && st.status === 'empty' && !S.showPairOnce) { S.showPair = true; S.showPairOnce = true; }
  return `<div class="stack" style="gap:16px">${c ? msg + vSyncCard(c) : vSyncSetup()}${emergencyFile()}</div>`;
}

/* --- Today: one day of hers, editable --- */
function vDay() {
  const M = model();
  if (!M.rep) return hdr('Sapna Health', 'Her day', refreshBtn()) + vNoReport(M.c);
  const { m, editable } = M; const T = m.T; const k = S.dash.day;
  const F = freshness(M);
  const dd = m.daily[k] || { kcal: 0, protein: 0, items: 0 };
  const burnK = m.burned[k] || 0; const goalK = T.kcal + Math.round(burnK / 2);
  const td = dkey(new Date());
  const title = k === td ? 'Today' : k === dadd(td, -1) ? 'Yesterday' : esc(dlabel(k, { weekday: 'long' }));
  const nav = `<div class="row" style="gap:6px"><button class="ib" type="button" data-dnav="-1" aria-label="Previous day" ${k <= m.first ? 'disabled' : ''}>‹</button>${k !== m.last ? `<button class="btn ghost sm" type="button" data-dpick="${m.last}">${m.last === td ? 'Today' : 'Latest'}</button>` : ''}<button class="ib" type="button" data-dnav="1" aria-label="Next day" ${k >= m.last ? 'disabled' : ''}>›</button>${refreshBtn()}</div>`;

  // date strip: the last 30 days, each with a tiny calories bar
  const from = m.first > dadd(m.last, -29) ? m.first : dadd(m.last, -29);
  const strip = []; for (let d = from; d <= m.last; d = dadd(d, 1)) strip.push(d);
  const stripHtml = `<div class="dstrip" id="dstrip" role="group" aria-label="Pick a day">${strip.map((d) => { const kc = m.daily[d]?.kcal || 0; const g = T.kcal + Math.round((m.burned[d] || 0) / 2); return `<button class="dchip" type="button" data-dpick="${d}" aria-pressed="${d === k}" aria-label="${esc(dlabel(d))}${kc ? ' · ' + n0(kc) + ' kcal' : ''}"><span>${d === td ? 'Today' : DOW[dparse(d).getDay()]}</span><b>${dparse(d).getDate()}</b><i class="${kc > g * 1.1 ? 'over' : ''}" style="--p:${Math.min(100, (kc / g) * 100)}%"></i></button>`; }).join('')}</div>`;

  const pct = (v, g) => Math.min(100, g ? (v / g) * 100 : 0);
  const wIn = m.weighIns.find((w) => w.date === k);
  const tile = (label, val, unit, sub, bar, editAttr) => `<${editAttr ? `button type="button" ${editAttr}` : 'div'} class="tile"><span class="eyebrow">${label}</span><span class="v">${val}${unit ? ` <small>${unit}</small>` : ''}</span>${bar != null ? `<span class="bar"><i style="width:${bar}%;${bar >= 100 && label === 'Eaten' && dd.kcal > goalK * 1.1 ? 'background:var(--danger)' : ''}"></i></span>` : ''}<span class="small muted">${sub}</span>${editAttr ? '<span class="tedit">Edit</span>' : ''}</${editAttr ? 'button' : 'div'}>`;
  const ed = editable ? `data-dayedit="${k}"` : '';
  const tiles = `<div class="tiles">
    ${tile('Eaten', n0(dd.kcal), 'kcal', `of ${n0(goalK)}${burnK ? ` (+${n0(Math.round(burnK / 2))} earned)` : ''}`, pct(dd.kcal, goalK))}
    ${tile('Protein', r1(dd.protein), 'g', `goal ${T.protein} g`, pct(dd.protein, T.protein))}
    ${tile('Water', fmtL((m.water[k] || 0) * 250), '', `of ${fmtL((T.water || 8) * 250 + (m.sessions.some((s) => s.date === k) ? 500 : 0))}${lastSip(m, k)}`, pct((m.water[k] || 0) * 250, (T.water || 8) * 250 + (m.sessions.some((s) => s.date === k) ? 500 : 0)), ed)}
    ${tile('Steps', n0(m.steps[k]), '', `${burnK ? n0(burnK) + ' kcal burned' : 'no burn logged'}${wIn ? ` · ⚖ ${wIn.kg} kg` : ''}`, null, ed)}
  </div>`;

  const items = m.food.filter((f) => f.date === k).sort((a, b) => (a.at || 0) - (b.at || 0));
  const meals = MEAL_ORDER.map((ml) => {
    const its = items.filter((f) => f.meal === ml); if (!its.length && !editable) return '';
    const sum = its.reduce((s, f) => s + (f.kcal || 0), 0);
    return `<div class="meal"><div class="between"><span><strong>${MEAL_LABEL[ml]}</strong> <span class="small muted">${sum ? n0(sum) + ' kcal' : editable ? '· nothing yet' : ''}</span></span>${editable ? `<button class="addb" type="button" data-fadd="${k}" data-meal="${ml}" aria-label="Add to ${MEAL_LABEL[ml]}">+ Add</button>` : ''}</div>
      ${its.map((f) => `<div class="fi"><span class="fn">${f._p ? '⏳ ' : ''}<b>${esc(f.name)}</b><span class="small muted">${f.mult && f.mult !== 1 ? `${f.mult}× ` : ''}${esc(f.portion || '')}${f.at ? ` · ${new Date(f.at).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })}` : ''}</span></span><span class="fk">${f.kcal != null ? `<b>${n0(f.kcal)}</b><span class="small muted">${r1(f.protein)} g</span>` : ''}</span>${editable && f.id ? `<span class="fa"><button class="ib sm" type="button" data-fedit="${esc(f.id)}" aria-label="Edit ${esc(f.name)}">✎</button><button class="ib sm" type="button" data-fdel="${esc(f.id)}" aria-label="Remove ${esc(f.name)}">🗑</button></span>` : ''}</div>`).join('')}</div>`;
  }).join('');
  const daySess = m.sessions.filter((s) => s.date === k);
  const act = m.r.activeSession && m.r.activeSession.startedAt > Date.now() - 4 * 3600000 && k === td ? `<div class="card" style="border-color:color-mix(in srgb,var(--amber) 45%,transparent)"><p class="eyebrow" style="color:var(--amber)"><span class="live" style="background:var(--amber);box-shadow:0 0 8px var(--amber)"></span>At the gym now</p><p class="big" style="font-size:22px;margin-top:6px">${esc(m.r.activeSession.title)}</p><p class="small muted">Started ${new Date(m.r.activeSession.startedAt).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })} · ${m.r.activeSession.done.length} moves done${m.r.activeSession.done.length ? ': ' + esc(m.r.activeSession.done.join(', ')) : ''}</p></div>` : '';

  return hdr(`${esc(m.r.name || 'Sapna')} · ${esc(dlabel(k, { day: 'numeric', month: 'long' }))}`, title, nav) + `<div class="stack daycol" style="gap:14px">
    ${F.line}${F.warn}
    ${editable ? vPending() : ''}
    ${act}
    ${stripHtml}
    ${tiles}
    <div class="card stack" id="daycard" style="gap:10px"><div class="between"><h2>Food</h2><span class="small muted">${dd.items || 0} item${dd.items === 1 ? '' : 's'}</span></div>${meals || '<p class="muted">Nothing logged this day.</p>'}</div>
    ${daySess.length ? `<div class="card stack" style="gap:10px"><h2>Workout</h2>${daySess.map((s) => `<div class="meal"><div class="between"><strong>🏋️ ${esc(s.title)}</strong><span class="small muted">${s.minutes || '?'} min${s.kcal ? ` · ${n0(s.kcal)} kcal` : ''}</span></div>${sessBody(s)}</div>`).join('')}</div>` : ''}
    ${M.c ? vPushCard() : ''}
  </div>`;
}

/* --- Progress: trends over a range --- */
function vProgress() {
  const M = model();
  if (!M.rep) return hdr('Sapna Health', 'Progress', refreshBtn()) + vNoReport(M.c);
  const { m, editable } = M; const T = m.T; const F = freshness(M);
  const days = rangeDays(m);
  const logged = days.filter((k) => m.daily[k]?.kcal > 0);
  const avg = (f) => (logged.length ? logged.reduce((s, k) => s + f(k), 0) / logged.length : 0);
  const onT = logged.filter((k) => Math.abs(m.daily[k].kcal - T.kcal) <= T.kcal * 0.1).length;
  const protHit = logged.filter((k) => m.daily[k].protein >= T.protein * 0.9).length;
  const sess = m.sessions.filter((s) => s.date >= days[0] && s.date <= m.last).sort((a, b) => (a.date < b.date ? 1 : -1));
  const mins = sess.reduce((s, x) => s + (x.minutes || 0), 0);
  const wNow = m.weighIns.at(-1), wStart = m.r.profile?.startKg ?? m.weighIns[0]?.kg;
  const lifts = {};
  m.sessions.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((s) => {
    const best = {}; (s.sets || []).forEach((x) => { if (x.kg > 0) best[x.name] = Math.max(best[x.name] || 0, x.kg); });
    Object.entries(best).forEach(([n, kg]) => { const L = lifts[n] || (lifts[n] = { first: kg, last: kg, top: kg, n: 0 }); L.last = kg; L.top = Math.max(L.top, kg); L.n++; });
  });
  const liftRows = Object.entries(lifts).sort((a, b) => b[1].n - a[1].n).slice(0, 12);
  const inR = m.food.filter((f) => f.date >= days[0]);
  const cnt = {}; inR.forEach((f) => { const c = cnt[f.name] || (cnt[f.name] = { n: 0, kcal: 0 }); c.n++; c.kcal += f.kcal || 0; });
  const top = Object.entries(cnt).sort((a, b) => b[1].n - a[1].n).slice(0, 8);
  const mealK = MEAL_ORDER.map((ml) => [ml, inR.filter((f) => f.meal === ml).reduce((s, f) => s + (f.kcal || 0), 0)]);
  const mealTot = mealK.reduce((s, x) => s + x[1], 0);
  const missing = days.filter((k) => !(m.daily[k]?.items > 0)).length;
  const tips = [];
  if (logged.length && protHit < logged.length / 2) tips.push(['Protein is the gap', `Hit 90%+ of ${T.protein} g on only ${protHit} of ${logged.length} logged days.`]);
  if (missing > 1) tips.push(['Days not logged', `${missing} of ${days.length} days have no food logged.`]);
  if (logged.length && avg((k) => m.daily[k].kcal) > T.kcal * 1.12) tips.push(['Running over', `Averaging ${n0(avg((k) => m.daily[k].kcal))} kcal vs a ${n0(T.kcal)} target.`]);
  const cyc = m.r.cycle ? `<div class="card"><p class="eyebrow" style="color:var(--pink)">Cycle · shared by her</p><p class="big" style="font-size:24px;margin-top:6px">${esc(m.r.cycle.phase)} · day ${esc(m.r.cycle.day)}</p><p class="small muted">${m.r.cycle.daysToNext >= 0 ? `Next period in about ${m.r.cycle.daysToNext} days` : `Period ${-m.r.cycle.daysToNext} days late`}</p></div>` : '';
  const kpi = (l, v, s) => `<div class="tile"><span class="eyebrow">${l}</span><span class="v">${v}</span><span class="small muted">${s}</span></div>`;
  const rangeLbl = { 7: 'last 7 days', 30: 'last 30 days', all: 'all time' }[S.dash.range];
  return hdr(`${esc(m.r.name || 'Sapna')} · ${rangeLbl}`, 'Progress', refreshBtn()) + `<div class="stack dash" style="gap:14px">
    ${F.line}${F.warn}
    <div class="seg" role="group" aria-label="Range">${[['7', '7 days'], ['30', '30 days'], ['all', 'All time']].map(([v, l]) => `<button type="button" data-range="${v}" aria-pressed="${S.dash.range === v}">${l}</button>`).join('')}</div>
    <div class="tiles kpis">
      ${kpi('Avg calories', n0(avg((k) => m.daily[k].kcal)), `target ${n0(T.kcal)} · ${logged.length} days logged`)}
      ${kpi('Avg protein', n0(avg((k) => m.daily[k].protein)) + ' g', `goal ${T.protein} g · hit ${protHit}×`)}
      ${kpi('On target', `${onT}/${logged.length}`, 'days within ±10%')}
      ${kpi('Workouts', sess.length, `${n0(mins)} min · ${n0(sess.reduce((s, x) => s + (x.kcal || 0), 0))} kcal`)}
      ${kpi('Weight', wNow ? r1(wNow.kg) + ' kg' : '—', wNow && wStart ? `${wNow.kg - wStart > 0 ? '+' : ''}${r1(wNow.kg - wStart)} kg since start` : 'no weigh-ins yet')}
      ${kpi('Avg steps', n0(days.reduce((s, k) => s + (m.steps[k] || 0), 0) / Math.max(1, days.filter((k) => m.steps[k] > 0).length)), 'on days logged')}
    </div>
    ${tips.length ? `<div class="stack" style="gap:8px">${tips.map(([t, b]) => `<div class="card warn"><strong>${esc(t)}</strong><p class="small muted">${esc(b)}</p></div>`).join('')}</div>` : ''}
    <div class="pgrid">
      <div class="card stack full"><div class="between"><h2>Calories</h2><span class="small muted">dashed = ${n0(T.kcal)} · red = 10%+ over</span></div>${barChart('ch-kcal', m, days, (k) => m.daily[k]?.kcal || 0, T.kcal, { overIsBad: true })}</div>
      <div class="card stack"><div class="between"><h2>Protein</h2><span class="small muted">dashed = ${T.protein} g</span></div>${barChart('ch-prot', m, days, (k) => m.daily[k]?.protein || 0, T.protein, { fmt: (v) => n0(v) + ' g' })}</div>
      <div class="card stack"><h2>Steps</h2>${barChart('ch-steps', m, days, (k) => m.steps[k] || 0, 0)}</div>
      ${m.weighIns.length >= 2 ? `<div class="card stack"><div class="between"><h2>Weight</h2><span class="small muted">${m.weighIns.length} weigh-ins</span></div>${weightChart(m)}</div>` : ''}
      ${cyc}
      <div class="card stack"><div class="between"><h2>Workouts</h2><span class="small muted">${sess.length} in range</span></div>
        ${sess.length ? sess.map((s) => `<details class="sess" data-k="sess-${esc(s.id || s.date + s.title)}"><summary><span><strong>${esc(s.title)}</strong><span class="small muted" style="display:block">${esc(dlabel(s.date))} · ${s.minutes || '?'} min${s.kcal ? ` · ${n0(s.kcal)} kcal` : ''} · ${((n) => `${n} move${n === 1 ? '' : 's'}`)((s.done || []).length || new Set((s.sets || []).map((x) => x.name)).size)}</span></span><span class="pill">${(s.sets || []).length} set${(s.sets || []).length === 1 ? '' : 's'}</span></summary>${sessBody(s)}${editable && s.id ? `<button class="btn danger sm" type="button" data-sdel="${esc(s.id)}" data-title="${esc(s.title)}" style="margin-top:8px">Delete this workout</button>` : ''}</details>`).join('') : '<p class="muted">No workouts in this range.</p>'}</div>
      ${liftRows.length ? `<div class="card stack"><h2>Strength</h2><table><thead><tr><th>Lift</th><th>First</th><th>Now</th><th>Best</th></tr></thead><tbody>${liftRows.map(([n, L]) => `<tr><td>${esc(n)}</td><td>${L.first} kg</td><td>${L.last} kg${L.last > L.first ? ` <span class="ok">+${r1(L.last - L.first)}</span>` : ''}</td><td>${L.top} kg</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${inR.length ? `<div class="card stack"><h2>Food habits</h2>
        <p class="eyebrow">Calories by meal</p>${mealK.map(([ml, v]) => `<div class="mrow"><span>${MEAL_LABEL[ml]}</span><div class="bar"><i style="width:${mealTot ? (v / mealTot) * 100 : 0}%"></i></div><span class="small muted">${mealTot ? Math.round((v / mealTot) * 100) : 0}%</span></div>`).join('')}
        <p class="eyebrow" style="margin-top:6px">Most logged</p>${top.map(([n, c]) => `<div class="between"><span>${esc(n)}</span><span class="small muted">${c.n}×${c.kcal ? ` · ~${n0(c.kcal / c.n)} kcal` : ''}</span></div>`).join('')}</div>` : ''}
      <details class="card full" data-k="table"><summary><strong>Every day as a table</strong> <span class="small muted">tap a row to open that day</span></summary><div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Day</th><th>kcal</th><th>Protein</th><th>Water</th><th>Steps</th><th>Burned</th><th>Gym</th></tr></thead><tbody>
        ${days.slice().reverse().map((k) => `<tr data-day="${k}" class="trow"><td>${esc(dlabel(k))}</td><td${(m.daily[k]?.kcal || 0) > T.kcal * 1.1 ? ' class="bad"' : ''}>${m.daily[k]?.kcal ? n0(m.daily[k].kcal) : '—'}</td><td>${m.daily[k]?.protein ? r1(m.daily[k].protein) + ' g' : '—'}</td><td>${m.water[k] || '—'}</td><td>${m.steps[k] ? n0(m.steps[k]) : '—'}</td><td>${m.burned[k] ? n0(m.burned[k]) : '—'}</td><td>${m.sessions.some((s) => s.date === k) ? '✓' : ''}</td></tr>`).join('')}
      </tbody></table></div></details>
    </div>
  </div>`;
}

function sessBody(s) {
  const by = {}; (s.sets || []).forEach((x) => (by[x.name] = by[x.name] || []).push(x));
  return `<div class="stack small" style="gap:6px;margin-top:8px">${Object.entries(by).map(([n, sets]) => `<div class="between"><span>${esc(n)}</span><span class="muted">${sets.map((x) => (x.kg ? `${x.kg}×${x.reps}` : `${x.reps}`)).join(' · ')}</span></div>`).join('') || '<span class="muted">No sets recorded.</span>'}</div>`;
}

function wireShared() {
  const c = syncCfg();
  if (!c && S.token && S.syncExists === undefined) {
    S.syncExists = null; // checking
    fetch('https://api.github.com/repos/drishabhh/sapna-sync/contents/dashboard.enc.json', { headers: { Authorization: `Bearer ${S.token}`, Accept: 'application/vnd.github+json' }, cache: 'no-store' })
      .then((r) => { S.syncExists = r.ok; if (r.ok && (S.tab === 'day' || S.tab === 'settings')) render(); }).catch(() => { S.syncExists = false; });
  }
  document.querySelectorAll('[data-link]').forEach((b) => (b.onclick = showLink));
  const ps = $('#psend');
  if (ps) ps.onclick = async () => {
    const msg = $('#pnote').value.trim(); if (!msg) return toast('Write something first');
    ps.disabled = true; ps.textContent = 'Sending…';
    try { toast(sentMsg(await sendPush('Rishu 💌', msg, { kind: 'note', tab: 'today' }))); $('#pnote').value = ''; }
    catch (e) { toastLong(e.message); }
    ps.disabled = false; ps.textContent = 'Send to her phone';
  };
  const refresh = async () => { await fetchSync(); if (LIVE_TABS.includes(S.tab)) { const y = scrollY; render(); scrollTo(0, y); } };
  if (c && LIVE_TABS.includes(S.tab) && S.sync.status !== 'loading' && (!S.sync.fetchedAt || Date.now() - S.sync.fetchedAt > 60000)) refresh();
  [$('#srefresh'), $('#sretry')].forEach((rb) => { if (rb) rb.onclick = () => { S.sync.fetchedAt = 0; rb.disabled = true; rb.innerHTML = rb.id === 'srefresh' ? '<span class="spin"></span>' : 'Checking…'; refresh(); }; });
  const mk = $('#smake');
  if (mk) mk.onclick = async () => {
    const [o, r] = $('#sr').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').split('/');
    const t = $('#st').value.trim() || S.token;
    if (!o || !r) return toast('Repo should look like drishabhh/sapna-sync');
    { const bad = tokenShapeError(t); if (bad) return toast(bad); }
    mk.disabled = true; mk.textContent = 'Checking…';
    try {
      const res = await syncGh({ o, r, t }, '');
      const j = await res.json().catch(() => ({}));
      if (res.status === 401) throw new Error('GitHub doesn’t recognise that token — it was regenerated, expired or deleted. Regenerate it on GitHub and paste the new value right away.');
      if (res.status === 404) throw new Error('Repo not found, or the token was not given access to it.');
      if (!res.ok) throw new Error(j.message || `GitHub ${res.status}`);
      if (!j.private) throw new Error('That repo is PUBLIC. Her data must go to a private repo — make it private first.');
      const k = b64u(crypto.getRandomValues(new Uint8Array(32)));
      localStorage.setItem(LS_SYNC, JSON.stringify({ o, r, b: j.default_branch || 'main', t, k }));
      S.showPair = true; S.showPairOnce = true; S.sync = { status: 'idle' }; S.syncReport = null;
      render(); toast('Pairing code ready — send it to Sapna');
    } catch (e) { toast(e.message); mk.disabled = false; mk.textContent = 'Create pairing code'; }
  };
  const use = $('#suse');
  if (use) use.onclick = () => {
    const pc = parsePairing($('#scode').value);
    if (!pc) return toast('That is not a SAPNA-SYNC-1 code');
    localStorage.setItem(LS_SYNC, JSON.stringify(pc)); S.sync = { status: 'idle' }; S.syncReport = null; S.showPair = false; render();
  };
  const cp = $('#pcopy'); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText($('#pcode').value); toast('Copied — paste it to Sapna on WhatsApp'); } catch { $('#pcode').select(); toast('Select all and copy'); } };
  const sh = $('#pshare'); if (sh) sh.onclick = () => navigator.share({ text: `Paste this in Sapna Health → Settings → Live sync with Rishu:\n\n${$('#pcode').value}` }).catch(() => {});
  const hd = $('#phide'); if (hd) hd.onclick = () => { S.showPair = false; render(); };
  const sw = $('#pshow'); if (sw) sw.onclick = () => { S.showPair = true; render(); };
  const up = $('#supd'); if (up) up.onclick = () => { S.showUpd = true; render(); $('#sutok')?.focus(); };
  const us = $('#susave');
  if (us) us.onclick = async () => {
    const t = $('#sutok').value.trim(); const cfg = syncCfg(); if (!cfg) return;
    { const bad = tokenShapeError(t); if (bad) return toast(bad); }
    us.disabled = true; us.textContent = 'Checking…';
    try {
      const res = await syncGh({ ...cfg, t }, '');
      if (res.status === 401) throw new Error('GitHub doesn’t recognise that token — it was regenerated, expired or deleted. Regenerate it on GitHub and paste the new value right away.');
      if (res.status === 404) throw new Error('That token has no access to ' + cfg.o + '/' + cfg.r + '.');
      const j = await res.json(); if (!j.private) throw new Error('The sync repo is public — make it private first.');
      const w = await fetch(`https://api.github.com/repos/${cfg.o}/${cfg.r}/git/blobs`, { method: 'POST', headers: { Authorization: `Bearer ${t}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ content: 'write-check', encoding: 'utf-8' }) });
      if (w.status !== 201 && w.status !== 409) throw new Error('That token can read sapna-sync but not write it — set Contents: Read and write.');
      localStorage.setItem(LS_SYNC, JSON.stringify({ ...cfg, t }));
      S.showUpd = false; S.syncTokenDead = false; S.showPair = true; S.sync = { status: 'idle' };
      render(); toast('New pairing code ready — send it to Sapna');
    } catch (e) { toast(e.message); us.disabled = false; us.textContent = 'Check & make new code'; }
  };
  const off = $('#soff'); if (off) off.onclick = () => { if (!confirm('Disconnect this browser from live sync? Her phone keeps syncing; you can reconnect with the pairing code.')) return; localStorage.removeItem(LS_SYNC); S.syncReport = null; S.sync = { status: 'idle' }; render(); };
  const inp = $('#rep');
  if (inp) inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const raw = (await f.text()).replace(/^\uFEFF/, ''); const j = JSON.parse(raw.slice(Math.max(0, raw.indexOf('{')), raw.lastIndexOf('}') + 1)); if (j.type !== 'sapna-health-report') throw 0;
      if (S.report && new Date(j.generatedAt) < new Date(S.report.generatedAt) && !confirm('This file is older than the one already open. Use it anyway?')) return;
      S.report = j; S.dash.day = null;
      try { localStorage.setItem(LS_REPORT, JSON.stringify(j)); } catch { toast('Opened — too big to remember on this phone, re-open it next time.'); }
      render();
    } catch { toast("That isn't one of Sapna's dashboard files."); }
  };
  document.querySelectorAll('[data-range]').forEach((b) => (b.onclick = () => { S.dash.range = b.dataset.range; render(); }));
  const toDay = (k) => { if (!k) return; S.dash.day = k; const y = scrollY; if (S.tab !== 'day') { S.tab = 'day'; try { localStorage.setItem(LS_TAB, 'day'); } catch {} render(); scrollTo(0, 0); } else { render(); scrollTo(0, y); } };
  document.querySelectorAll('[data-dpick]').forEach((b) => (b.onclick = () => toDay(b.dataset.dpick)));
  const ds = $('#dstrip'); if (ds) { const sel = ds.querySelector('[aria-pressed=true]'); if (sel) ds.scrollLeft = sel.offsetLeft - ds.clientWidth / 2 + sel.offsetWidth / 2; }
  document.querySelectorAll('.cbar').forEach((b) => {
    const tip = () => { const t = b.closest('.chart').querySelector('.ctip'); t.textContent = b.dataset.tip; t.classList.add('on'); };
    b.onpointerenter = tip; b.onfocus = tip;
    b.onclick = () => { tip(); if (b.dataset.day) toDay(b.dataset.day); };
  });
  document.querySelectorAll('.trow').forEach((r) => (r.onclick = () => toDay(r.dataset.day)));
  document.querySelectorAll('[data-dnav]').forEach((b) => (b.onclick = () => toDay(dadd(S.dash.day, +b.dataset.dnav))));
}

/* --- Workouts --- */
function exOf(id) { return S.content.exercises.find((e) => e.id === id); }
function vWorkouts() {
  const c = S.content;
  if (S.editing != null) {
    const p = c.plans[S.editing]; if (!p) { S.editing = null; return vWorkouts(); }
    return `<div class="stack" style="gap:14px">
      <div class="between"><button class="btn ghost sm" type="button" id="back">← All plans</button><button class="btn ghost sm" type="button" id="dupplan">Duplicate</button></div>
      <label class="f">Plan name<input class="input" id="pt" value="${esc(p.title)}"></label>
      <label class="f">What she's hitting today (one line she sees on the tile)<input class="input" id="pf" placeholder="e.g. Glutes + hamstrings, light core" value="${esc(p.focus || '')}"></label>
      <div class="f">Show this plan on<div class="chips" style="margin-top:6px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d, i) => `<button class="chip" type="button" data-day="${i}" aria-pressed="${(p.days || []).includes(i)}">${d}</button>`).join('')}</div><span class="small muted">No day picked = it rotates with your other undated plans on her gym days.</span></div>
      <label class="f">Note for Sapna<textarea class="input" id="pn">${esc(p.note || '')}</textarea></label>
      <div class="between"><h2>Moves (${p.moves.length})</h2><button class="btn sm" type="button" id="add">+ Add from library</button></div>
      <div class="stack" style="gap:8px">${p.moves.map((m, i) => { const e = exOf(m.exId) || { name: m.exId, gif: '' }; return `<div class="move">

const FOOD_JSON_EXAMPLE = `[
  { "name": "Besan chilla", "portion": "1 piece", "kcal": 180, "protein": 9 },

function parseFoodJson(text) {

  if (!clean) return { foods: [], errors };
  let j; try { j = JSON.parse(clean); } catch { return { foods: [], errors: ['That isn’t valid JSON yet — check commas and quotes.'] }; }
  const list = Array.isArray(j) ? j : j && typeof j === 'object' && Array.isArray(j.foods) ? j.foods : [j];
  const norm = (k) => String(k).toLowerCase().replace(/[^a-z]/g, '');
  const pick = (o, keys) => { for (const [k, v] of Object.entries(o)) if (keys.includes(norm(k))) return v; return undefined; };
  const num = (v) => (typeof v === 'number' ? v : typeof v === 'string' ? parseFloat(v.replace(/[^0-9.\-]/g, '')) : NaN);
  const r1 = (x) => Math.round(x * 10) / 10;

  list.forEach((o, i) => {
    if (!o || typeof o !== 'object') return errors.push(`Item ${i + 1}: not an object`);
    const name = String(pick(o, ['name', 'food', 'item', 'title']) ?? '').trim();
    const kcal = num(pick(o, ['kcal', 'calories', 'cal', 'energy', 'energykcal']));
    const protein = num(pick(o, ['protein', 'proteing', 'proteingrams']) ?? 0);
    const portion = String(pick(o, ['portion', 'serving', 'servingsize', 'quantity', 'qty']) ?? '1 serving').trim() || '1 serving';
    if (!name) return errors.push(`Item ${i + 1}: missing "name"`);
    if (!Number.isFinite(kcal) || kcal <= 0 || kcal > 5000) return errors.push(`${name}: "kcal" should be a number`);
    const opt = (keys) => { const v = num(pick(o, keys)); return Number.isFinite(v) && v >= 0 ? r1(v) : undefined; };
    const tagsRaw = pick(o, ['tags', 'tag', 'category']);
    const tags = Array.isArray(tagsRaw) ? tagsRaw.map(String).map((t) => t.trim().toLowerCase()).filter(Boolean).slice(0, 8) : typeof tagsRaw === 'string' ? tagsRaw.split(/[,;]/).map((t) => t.trim().toLowerCase()).filter(Boolean).slice(0, 8) : undefined;
    const f = { id: 'food-' + slug(name) + '-' + Math.random().toString(36).slice(2, 6), name: name.slice(0, 60), portion: portion.slice(0, 90), kcal: Math.round(kcal), protein: Number.isFinite(protein) && protein >= 0 ? r1(protein) : 0 };
