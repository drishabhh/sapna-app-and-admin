    let head = '';
    if (S.foodSort === 'az' && !q) { const L = (f.name.match(/[a-z0-9]/i) || ['#'])[0].toUpperCase(); if (L !== last) { last = L; head = `<p class="letter">${/[0-9]/.test(L) ? '#' : L}</p>`; } }
    return head + `<button class="lrow${S.foodChanged.has(f.id) ? ' chg' : ''}" type="button" data-lopen="${i}" id="lf-${esc(f.id)}"><span class="lmain"><b>${hl(f.name, q)}</b><span class="small muted">${esc(f.portion || '')} · ${f.protein} g protein${n ? ` · <span style="color:var(--acc)">she logged ${n}×</span>` : ''}</span></span><span class="lk"><b>${n0(f.kcal)}</b><span class="small muted">kcal</span></span><span class="chev">›</span></button>`;
  }).join('');
  const changed = S.foodChanged.size ? `<p class="small" style="color:var(--amber);margin:0 0 8px">● ${S.foodChanged.size} food${S.foodChanged.size === 1 ? '' : 's'} changed — Publish to send to her app</p>` : '';
  return changed + (q ? `<p class="small muted" style="margin:0 0 8px">${rows.length} of ${S.content.foods.length}</p>` : '') + `<div class="list">${out || `<div style="padding:14px" class="stack"><p class="muted">No food matches “${esc(S.foodQ)}”.</p><button class="btn sm" type="button" id="fnewq" style="align-self:flex-start">+ Add “${esc(S.foodQ.trim())}”</button></div>`}</div>`;
}
function renderFoodList() {
  const box = $('#flist'); if (!box) return;
  box.innerHTML = foodListHtml();
  box.querySelectorAll('[data-lopen]').forEach((b) => (b.onclick = () => libFoodSheet(+b.dataset.lopen)));
  const nq = $('#fnewq'); if (nq) nq.onclick = () => libFoodSheet(null, S.foodQ.trim());
  if (S._m) wireEdits(S._m);
  if (S.foodFlash) { const el = document.getElementById('lf-' + S.foodFlash); S.foodFlash = null; if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
}
function libFoodSheet(i, presetName = '') {
  const F = S.content.foods; const isNew = i == null;
  const f = isNew ? { name: presetName, portion: '1 serving', kcal: '', protein: '' } : F[i];
  const more = f.carbs != null || f.fat != null || f.fiber != null || (f.tags && f.tags.length);
  sheet(isNew ? 'New food' : 'Edit food', `
    <label class="f">Name<input class="input" name="name" value="${esc(f.name)}" placeholder="e.g. Besan chilla"></label>
    <label class="f">Portion <span class="faint">(what 1× means)</span><input class="input" name="portion" value="${esc(f.portion || '')}" placeholder="1 piece, 1 bowl, 100 g…"></label>
    <div class="g2"><label class="f">Calories<input class="input" name="kcal" inputmode="numeric" value="${f.kcal ?? ''}"></label><label class="f">Protein (g)<input class="input" name="protein" inputmode="decimal" value="${f.protein ?? ''}"></label></div>
    <details ${more ? 'open' : ''}><summary class="small" style="cursor:pointer;font-weight:700">More nutrition & tags (optional)</summary><div class="stack" style="margin-top:8px">
      <div class="g3"><label class="f">Carbs g<input class="input" name="carbs" inputmode="decimal" value="${f.carbs ?? ''}"></label><label class="f">Fat g<input class="input" name="fat" inputmode="decimal" value="${f.fat ?? ''}"></label><label class="f">Fiber g<input class="input" name="fiber" inputmode="decimal" value="${f.fiber ?? ''}"></label></div>
      <label class="f">Tags <span class="faint">comma separated</span><input class="input" name="tags" value="${esc((f.tags || []).join(', '))}" placeholder="breakfast, veg"></label></div></details>
    <p class="small muted">Saved here first — tap <b>Publish</b> at the bottom to send it to her app.</p>
    <button class="btn" type="button" data-save>${isNew ? 'Add to library' : 'Save'}</button>
    ${isNew ? '' : '<button class="btn danger" type="button" data-del>Delete from library</button>'}`, (m, close) => {
    const g = (n) => m.querySelector(`[name="${n}"]`);
    m.querySelector('[data-save]').onclick = () => {
      const name = g('name').value.trim().slice(0, 60), kcal = numVal(g('kcal'));
      if (!name) return toast('Give it a name');
      if (kcal === null || kcal <= 0 || kcal > 5000) return toast('Calories should be a number');
      const dup = F.findIndex((x, j) => j !== i && x.name.trim().toLowerCase() === name.toLowerCase());
      if (dup >= 0) { if (!confirm(`“${F[dup].name}” is already in the library. Open that one instead?`)) return; close(); return libFoodSheet(dup); }
      const opt = (n) => { const v = g(n).value.trim(); if (!v) return undefined; const x = numVal(g(n)); return x === null ? undefined : Math.round(x * 10) / 10; };
      const tags = g('tags').value.split(/[,;]/).map((t) => t.trim().toLowerCase()).filter(Boolean).slice(0, 8);
      const next = { ...(isNew ? { id: 'food-' + slug(name) + '-' + Math.random().toString(36).slice(2, 6) } : f), name, portion: g('portion').value.trim().slice(0, 90) || '1 serving', kcal: Math.round(kcal), protein: Math.round((numVal(g('protein')) || 0) * 10) / 10 };
      ['carbs', 'fat', 'fiber'].forEach((n) => { const v = opt(n); if (v === undefined) delete next[n]; else next[n] = v; });
      if (tags.length) next.tags = tags; else delete next.tags;
      if (isNew) F.unshift(next); else F[i] = next;
      S.foodChanged.add(next.id); S.foodFlash = next.id;
      if (!matches(next, S.foodQ.trim().toLowerCase())) { S.foodQ = ''; const q = $('#fq'); if (q) q.value = ''; }
      close(); markDirty(); renderFoodList(); toast(isNew ? `${name} added — Publish to send` : 'Saved — Publish to send');
    };
    const del = m.querySelector('[data-del]');
    if (del) del.onclick = () => { if (!confirm(`Delete ${f.name} from the library? Meals she already logged stay.`)) return; F.splice(i, 1); S.foodChanged.add('del:' + f.id); close(); markDirty(); renderFoodList(); toast(`${f.name} deleted — Publish to send`); };
    if (isNew) g(presetName ? 'kcal' : 'name').focus();
  });
}
function wireFoods() {
  const F = S.content.foods;
  renderFoodList();
  document.querySelectorAll('[data-fseg]').forEach((b) => (b.onclick = () => { S.foodSeg = b.dataset.fseg; S.foodQ = ''; render(); }));
  document.querySelectorAll('[data-fsort]').forEach((b) => (b.onclick = () => { S.foodSort = b.dataset.fsort; document.querySelectorAll('[data-fsort]').forEach((x) => x.setAttribute('aria-pressed', x === b)); renderFoodList(); }));
  const q = $('#fq'); let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => { S.foodQ = q.value; renderFoodList(); }, 120); };
  $('#fnew').onclick = () => { if (S.foodSeg === 'hers') { if (S._m) herFoodSheet(null); else toast('Connect live sync first'); } else libFoodSheet(null); };
  const fjo = $('#fjopen'); if (fjo) fjo.onclick = () => { S.foodJsonOpen = !S.foodJsonOpen; render(); if (S.foodJsonOpen) $('#fjt')?.focus(); };
  if (S.foodJsonOpen) {
    const ta = $('#fjt'); let tt;
    const repaint = () => { const y = scrollY; const pos = ta.selectionStart; render(); scrollTo(0, y); const n = $('#fjt'); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} };
    ta.oninput = () => { S.foodJson = ta.value; clearTimeout(tt); tt = setTimeout(repaint, 350); };
    $('#fjx').onclick = () => { S.foodJsonOpen = false; render(); };
    $('#fjex').onclick = () => { S.foodJson = FOOD_JSON_EXAMPLE; repaint(); };
    const fp = $('#fjpaste'); if (fp) fp.onclick = async () => { try { S.foodJson = await navigator.clipboard.readText(); repaint(); } catch { toast('Allow clipboard, or long-press the box → Paste'); } };
    $('#fjadd').onclick = () => {
      const { foods } = parseFoodJson(S.foodJson || ''); if (!foods.length) return;
      let added = 0, updated = 0;
      foods.forEach((f) => {
        const ex = F.find((x) => x.name.trim().toLowerCase() === f.name.toLowerCase());
        if (ex) { Object.assign(ex, { ...f, id: ex.id }); S.foodChanged.add(ex.id); updated++; } else { F.unshift(f); S.foodChanged.add(f.id); added++; }
      });
      S.foodJson = ''; S.foodJsonOpen = false; S.foodQ = ''; S.foodSort = 'new'; markDirty(); render();
      toast(`${added} added${updated ? `, ${updated} updated` : ''} — tap Publish to send to her app`);
    };
  }
}

/* --- Settings --- */
function vSettings() {
  const M = model();
  const t = S.content.targets; const c = M.c;
  const r = M.m ? M.m.r : M.rep;
  const p = r && r.profile;
  const herCard = r && (r.reminders || p) ? `<div class="card stack" id="herset"><div class="between"><h2>Her app settings</h2>${M.editable ? '<button class="btn sm" type="button" id="pedit">Edit</button>' : ''}</div>
      <p class="small muted">As set on her phone${M.editable ? ' — edits go straight to her phone' : ''}.</p>
      <div class="stack small kv" style="gap:6px">
      ${p ? `<div class="between"><span class="muted">Goal · diet</span><span>${esc(GOALS[p.goalRaw] || r.goal || '—')} · ${esc(DIETS[p.diet] || p.diet || '—')}</span></div>
      <div class="between"><span class="muted">Gym days</span><span>${(p.gymDays || []).map((d) => DOW[d]).join(', ') || 'none picked'}</span></div>
      <div class="between"><span class="muted">Height · start weight</span><span>${p.heightCm || '—'} cm · ${p.startKg || '—'} kg</span></div>
      ${p.avoid ? `<div class="between"><span class="muted">Avoids</span><span>${esc(p.avoid)}</span></div>` : ''}` : ''}
      ${r.reminders ? `<div class="between" style="align-items:flex-start"><span class="muted">Reminders on</span><span style="text-align:right">${Object.entries(r.reminders).filter(([, v]) => v === true).map(([k]) => ({ punch: 'gym punch line', meals: 'meals', water: 'water', gym: 'workout days', weigh: 'weigh-in', steps: 'night steps' }[k] || k)).join(', ') || 'none'}</span></div>` : ''}
      </div></div>` : '';
  return hdr('Sapna Health · Admin', 'Settings') + `<div class="setgrid">
    <section class="stack" style="gap:12px"><p class="eyebrow sec">Her app · goes out when you Publish</p>
      <div class="card stack"><h2>Daily targets</h2><div class="g3">
        <label class="f">Calories<input class="input" id="tk" inputmode="numeric" value="${t.kcal}"></label>
        <label class="f">Protein g<input class="input" id="tp" inputmode="numeric" value="${t.protein}"></label>
        <label class="f">Water<input class="input" id="tw" inputmode="numeric" value="${t.water ?? 8}"></label></div></div>
      <div class="card stack"><h2>Note on her Today screen</h2><textarea class="input" id="msg" placeholder="e.g. Proud of you this week! Try paneer at dinner.">${esc(S.content.message || '')}</textarea><p class="small muted">Leave empty to hide it.</p></div>
      ${herCard}
    </section>
    <section class="stack" style="gap:12px"><p class="eyebrow sec">Connection</p>
      ${c ? vSyncCard(c) : vSyncSetup()}
      <div class="card stack"><h2>Notifications to her phone</h2>
        <label class="row" style="gap:10px;cursor:pointer"><input type="checkbox" id="autop" ${autoPush() ? 'checked' : ''} style="width:20px;height:20px"> <span>Tell her automatically every time I publish</span></label>
        <p class="small muted">${herPush() ? 'Her phone is registered.' : 'Her phone isn’t registered yet (needs app 1.7 + live sync).'} Pushes go through your GitHub workflow — usually 15–30 s.</p>
        <details><summary class="small" style="cursor:pointer">Instant mode (optional, ~1 s)</summary><div class="stack" style="margin-top:8px">
          <p class="small muted">Paste the Firebase <b>service-account key</b> JSON (Project settings → Service accounts → Generate new private key). It stays in this browser and travels to your other devices only through “Link another device”. If instant sending fails, the GitHub route is used automatically.</p>
          ${fcmSa() ? `<p class="small"><b>Instant mode on</b> · ${esc(fcmSa().client_email)}</p><button class="btn ghost sm" type="button" id="fcmoff" style="align-self:flex-start">Remove key from this device</button>` : `<textarea class="input mono" id="fcmsa" placeholder='{"type":"service_account", …}'></textarea><button class="btn sm" type="button" id="fcmsave" style="align-self:flex-start">Save key</button>`}
        </div></details></div>
      <div class="card stack"><h2>Link another device</h2><p class="small muted">Open this admin on another phone or laptop already set up — publishing and her live data — by scanning a QR. Nothing to paste.</p><button class="btn" type="button" data-link style="align-self:flex-start">Show QR & link</button></div>
      ${emergencyFile()}
      <div class="card stack small muted"><strong style="color:var(--text)">GitHub token & publishing</strong><span>Published version ${S.content.version || 0} · ${S.content.updatedAt ? new Date(S.content.updatedAt).toLocaleString('en-IN') : 'never'}</span>
        <div class="row wrapr"><button class="btn ghost sm" type="button" id="chtok">Change token (keeps changes)</button><button class="btn danger sm" type="button" id="logout">Forget token on this device</button></div></div>
    </section></div>`;
}
function wireSettings() {
  const t = S.content.targets;
  $('#tk').oninput = (e) => { t.kcal = Math.max(800, parseInt(e.target.value) || 0); markDirty(); };
  $('#tp').oninput = (e) => { t.protein = Math.max(20, parseInt(e.target.value) || 0); markDirty(); };
  $('#tw').oninput = (e) => { t.water = Math.max(1, parseInt(e.target.value) || 8); markDirty(); };
  $('#msg').oninput = (e) => { S.content.message = e.target.value.slice(0, 220); markDirty(); };
  $('#autop').onchange = (e) => { try { localStorage.setItem(LS_AUTOPUSH, e.target.checked ? '1' : '0'); } catch {} toast(e.target.checked ? 'She’ll be notified on every publish' : 'Publishing quietly'); };
  const fs = $('#fcmsave'); if (fs) fs.onclick = () => {
    let j; try { j = JSON.parse($('#fcmsa').value); } catch { return toast('That isn’t valid JSON — paste the whole file'); }
    if (j.type !== 'service_account' || !j.private_key || !j.client_email || !j.project_id) return toast('That isn’t a Firebase service-account key');
    localStorage.setItem(LS_FCM, JSON.stringify({ project_id: j.project_id, client_email: j.client_email, private_key: j.private_key })); render(); toast('Instant mode on');
  };
  const fo = $('#fcmoff'); if (fo) fo.onclick = () => { localStorage.removeItem(LS_FCM); render(); };
  $('#chtok').onclick = () => askToken('Paste a token with write access to sapna-app-and-admin.', null);
  $('#logout').onclick = () => { if (!confirm('Forget the GitHub token on this device? You’ll need to paste it (or scan a link) again.')) return; localStorage.removeItem(LS_TOKEN); S.token = ''; viewSetup(); };
}

const LIVE_TABS = ['day', 'progress', 'foods', 'settings'];
document.addEventListener('visibilitychange', () => { if (!document.hidden && LIVE_TABS.includes(S.tab) && syncCfg() && S.content) { S.sync.fetchedAt = 0; render(); } });
// Live: re-check her file every 20 s while the dashboard is on screen; repaint only if it changed.
setInterval(async () => {
  if (document.hidden || !['day', 'progress'].includes(S.tab) || document.querySelector('.modal') || !S.content || !syncCfg() || S.sync.status === 'loading') return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // don't disturb typing
  const before = S.sync.at;
  await fetchSync();
  if (S.sync.at !== before || S.sync.status === 'error') { const y = scrollY; render(); scrollTo(0, y); }
}, 20000);
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

async function boot() {
  const linked = sessionStorage.getItem('sapna_admin_linked'); sessionStorage.removeItem('sapna_admin_linked');
  if (linked === '1') setTimeout(() => toast('This device is linked — nothing to paste'), 400);
  if (linked === 'bad') setTimeout(() => toast('That link was incomplete — copy it again'), 400);
  if (!S.token) return viewSetup();
  app('<p class="muted">Loading…</p>');
  try { await loadContent(); render(); }
  catch (e) { viewSetup(e.message); }
}
boot();
</script>
</body>
</html>
