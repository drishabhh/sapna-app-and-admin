<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sapna Admin">
<meta name="robots" content="noindex">
<title>Sapna Health Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c10;--bg2:#121218;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--solid:#17171e;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--text:#f5f3ef;--muted:#a9a6b0;--faint:#7c7984;--coral:#ff7a59;--lime:#c6f432;--amber:#ffb224;--pink:#ff6fae;--cyan:#4fd1ff;--danger:#ff6b6b;--ok:#4ade80;--acc:var(--coral);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f2ee;--bg2:#ebe8e2;--card:#fff;--card2:#f0ede7;--solid:#fff;--line:rgba(20,18,24,.09);--line2:rgba(20,18,24,.18);--text:#141218;--muted:#5e5a66;--faint:#7d7985;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 110px)}
h1{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;font-size:clamp(32px,6vw,44px);line-height:1.02;margin:0}
h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.faint{color:var(--faint)}
.big{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrapr{flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g2{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:none;background:var(--acc);color:#0c0c10;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn:disabled{opacity:.45}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.input,select.input,textarea.input{min-height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:0 12px;width:100%}
textarea.input{padding:10px 12px;min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--acc)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs{position:sticky;top:0;z-index:10;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:calc(var(--st) + 8px) 0 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -16px 14px;padding-left:16px;padding-right:16px}
.tabs button{min-height:42px;border:none;border-radius:12px;background:var(--card2);color:var(--muted);font-weight:700;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--acc);color:#0c0c10}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line2);background:transparent;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#0c0c10}
.ex{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;padding:0}
.ex img,.ex .ph{width:100%;height:120px;object-fit:cover;background:#fff;display:block}
.ex .ph{background:var(--card2)}
.ex .t{padding:8px 10px;font-size:13px;font-weight:600;line-height:1.25}
.ex.on{border:2px solid var(--acc)}
.move{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.move img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#fff}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;grid-column:1/-1}
.move .yt{grid-column:1/-1;font-size:13px}.move .yt input{min-height:40px}
.nums input,.nums select{min-height:40px;text-align:center;padding:0 4px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px}td{padding:9px 6px;border-top:1px solid var(--line)}
.pub{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);z-index:20;max-width:956px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:20px;background:color-mix(in srgb,var(--solid) 90%,transparent);border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.pub[hidden]{display:none}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:980px;max-height:90vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:16px 16px calc(var(--sb) + 22px);border-top:1px solid var(--line2)}
.pill{display:inline-flex;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* ---------- Phone layout ---------- */
@media (max-width: 640px) {
  .wrap { padding-left: 14px; padding-right: 14px; }
  h1 { font-size: 32px; }
  .tabs { margin: 0 -14px 12px; padding-left: 14px; padding-right: 14px; gap: 4px; }
  .tabs button { font-size: 13px; min-height: 40px; padding: 0 4px; }
  .card { padding: 14px; border-radius: 18px; }
  .dash .grid .card .big { font-size: 26px !important; }
  .dash .grid .card { padding: 12px 14px; }
  .dash .grid .card p + .big { margin-top: 6px; }
  /* iOS zooms into inputs smaller than 16px — keep them 16px */
  .input, select.input, textarea.input { font-size: 16px; }
  .mono { font-size: 13px !important; }
  /* Food library: each food becomes a small card */
  .ftwrap { padding: 6px; overflow: visible !important; }
  .ftable thead { display: none; }
  .ftable, .ftable tbody { display: block; }
  .ftable tr { display: grid; grid-template-columns: 1fr 1fr 44px; gap: 6px 8px; padding: 10px 8px; border-top: 1px solid var(--line); align-items: end; }
  .ftable tr:first-child { border-top: none; }
  .ftable td { display: block; padding: 0; border: none; min-width: 0; }
  .ftable td::before { content: attr(data-l); display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .ftable td.fdel::before { content: none; }
  .ftable td:nth-child(1) { grid-column: 1 / 3; }
  .ftable td:nth-child(2) { grid-column: 1 / 3; grid-row: 2; }
  .ftable td:nth-child(3) { grid-column: 1; grid-row: 3; }
  .ftable td:nth-child(4) { grid-column: 2; grid-row: 3; }
  .ftable td.fdel { grid-column: 3; grid-row: 1; align-self: end; }
  .ftable input { min-width: 0 !important; width: 100% !important; }
  .pub { left: 8px; right: 8px; padding: 10px 10px 10px 14px; }
  .pub #pubSub { display: none; }
  .modal .sheet { max-height: 92vh; }
}

.warn{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 8%,var(--card))}
.chart{display:flex;flex-direction:column;gap:6px}.ctip{margin:0;min-height:19px}.ctip.on{color:var(--text);font-weight:700}
.cplot{position:relative;height:150px;border-bottom:1px solid var(--line2)}
.cbars{position:absolute;inset:0;display:grid;gap:2px;align-items:end}
.cbar{display:block;width:100%;border:none;padding:0;border-radius:4px 4px 0 0;background:var(--acc);min-height:2px;position:relative}
.cbar::after{content:'';position:absolute;inset:-10px -1px 0}
.cbar.zero{background:var(--card2)}.cbar.over{background:var(--danger)}.cbar.sel{outline:2px solid var(--text);outline-offset:1px}
.cbar:hover{filter:brightness(1.15)}
.cgoal{position:absolute;left:0;right:0;border-top:2px dashed var(--line2);pointer-events:none;z-index:1}
.cgoal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--muted);background:var(--bg2);padding:0 4px;border-radius:4px}
.clabels{display:grid;gap:2px;font-size:11px;color:var(--faint);text-align:left;white-space:nowrap;overflow:visible}
.clabels span{overflow:visible}
.wchart{width:100%;height:auto}.wchart .grid{stroke:var(--line);stroke-width:1}.wchart .axis{fill:var(--muted);font-size:10px}
.meal{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.fi{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.fi>span:first-child{min-width:0}.fi>span:last-child{white-space:nowrap}
.sess{border-top:1px solid var(--line);padding:10px 0 2px}.sess summary{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;list-style:none}.sess summary::-webkit-details-marker{display:none}
.mrow{display:grid;grid-template-columns:84px 1fr 38px;gap:10px;align-items:center}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--danger);font-weight:700}
.trow{cursor:pointer}.trow:hover td{background:var(--card2)}
.ib:disabled{opacity:.35}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}.steps a{color:var(--acc)}
.qr{background:#fff;border-radius:16px;padding:10px;align-self:center;width:min(300px,100%)}.qr svg{display:block;width:100%;height:auto}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:96px;word-break:break-all}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok);vertical-align:1px}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pub" id="pub" hidden>
  <div style="flex:1;min-width:0"><strong id="pubTitle">Unpublished changes</strong><div class="small muted" id="pubSub">Sapna's app picks them up next time it opens.</div></div>
  <button class="btn" id="pubBtn" type="button">Publish</button>
</div>
<script type="module">
/* Sapna Health admin — static page, runs entirely in Rishu's browser.
   Publishes plans/foods/targets to content/content.json in the public repo.
   Never touches Sapna's personal data; her reports are opened locally only. */
const REPO = { owner: 'drishabhh', name: 'sapna-app-and-admin', branch: 'main' };
const CONTENT_PATH = 'content/content.json';
const LIB_URL = '../data/gif-library.json';
const SITE = 'https://drishabhh.github.io/sapna-app-and-admin/';
const LS_TOKEN = 'sapna_admin_gh_token';
const LS_REPORT = 'sapna_admin_last_report';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'item';
const gif = (g) => (!g ? '' : /^https:/.test(g) ? g : SITE + g.replace(/^\.?\//, ''));

let S = { token: '', content: null, sha: null, dirty: false, tab: 'status', lib: null, report: null, editing: null, picker: null, libQ: '', libPart: 'all', libGroup: 'exercises', foodQ: '' };
// "Link another device": #link=<base64url {v,t,s}> carries the admin token + sync settings.
// It's in the #fragment, so it never leaves this browser (not sent to GitHub Pages).
(() => {
  const m = location.hash.match(/^#link=([A-Za-z0-9_-]+)/);
  if (!m) return;
  try {
    const bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((m[1].length + 3) % 4));
    const j = JSON.parse(decodeURIComponent(escape(bin)));
    if (j.t) localStorage.setItem('sapna_admin_gh_token', j.t);
    if (j.s && j.s.k) localStorage.setItem('sapna_admin_sync_v1', JSON.stringify(j.s));
    if (j.f && j.f.private_key) localStorage.setItem('sapna_admin_fcm_sa', JSON.stringify(j.f));
    if (j.a === false) localStorage.setItem('sapna_admin_autopush', '0');
    sessionStorage.setItem('sapna_admin_linked', '1');
  } catch { sessionStorage.setItem('sapna_admin_linked', 'bad'); }
  history.replaceState(null, '', location.pathname + location.search);
})();
try { S.token = localStorage.getItem(LS_TOKEN) || ''; } catch {}
try { S.report = JSON.parse(localStorage.getItem(LS_REPORT) || 'null'); } catch {}

function toastLong(m) { const t = document.createElement('div'); t.className = 'toast'; t.role = 'alert'; t.style.maxWidth = '520px'; t.textContent = m; t.onclick = () => t.remove(); document.body.appendChild(t); setTimeout(() => t.remove(), 14000); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.role = 'status'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function unb64(s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, '')))); }
async function gh(path, opts = {}) {
  // No trailing slash for the repo itself: GitHub answers /repos/o/r/ with a 400 that has no CORS headers,
  // which the browser reports only as "Failed to fetch".
  const url = `https://api.github.com/repos/${REPO.owner}/${REPO.name}` + (path ? '/' + path.replace(/^\/+/, '') : '');
  const token = String(S.token || '').trim();
  const res = await fetch(url, { ...opts, headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  if (res.status === 404) return null;
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.message || `GitHub ${res.status}`);
  return j;
}
function markDirty() { S.dirty = true; renderPub(); }
function renderPub() { const p = $('#pub'); p.hidden = !S.dirty || !S.content; }

async function loadContent() {
  const meta = await gh(`contents/${CONTENT_PATH}?ref=${REPO.branch}`);
  if (meta && meta.content) { S.content = JSON.parse(unb64(meta.content)); S.sha = meta.sha; }
  else {
    // first run: start from the public copy (or an empty skeleton)
    const r = await fetch(SITE + CONTENT_PATH + '?t=' + Date.now()).catch(() => null);
    S.content = r && r.ok ? await r.json() : { version: 1, updatedAt: new Date(0).toISOString(), targets: { kcal: 1300, protein: 100, water: 8 }, plans: [], exercises: [], foods: [], message: '' };
    S.sha = null;
  }
}
/** Harmless write test: an unreferenced git blob. 201 = token can write this repo. */
async function canWrite(token) {
  const res = await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.name}/git/blobs`, { method: 'POST', headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${String(token).trim()}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ content: 'write-check', encoding: 'utf-8' }) });
  return res.status === 201;
}
const WRITE_HELP = 'On GitHub open the token → Edit → Repository access: include <b>sapna-app-and-admin</b> (you can keep sapna-sync too) → Permissions: <b>Contents: Read and write</b> → Update.';
/** Swap the saved token without reloading — unpublished changes stay. */
function askToken(reason, then) {
  document.getElementById('tokfix')?.remove();
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'tokfix';
  m.innerHTML = `<div class="sheet stack" role="dialog" aria-label="Token">
    <div class="between"><h2>${then ? 'Token can’t publish' : 'Change token'}</h2><button class="ib" type="button" id="tfx">✕</button></div>
    <p class="small muted">${reason}</p><p class="small">${WRITE_HELP}</p>
    <p class="small muted">Then press Check again — or paste a different token that has that access. Your unpublished changes stay.</p>
    <label class="f">Token<input class="input" id="tfv" type="password" autocomplete="off" placeholder="leave empty to re-check the saved one"></label>
    <p class="small" id="tfe" style="color:var(--danger)"></p>
    <button class="btn" type="button" id="tfs">${then ? 'Check again & publish' : 'Check & save token'}</button></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  $('#tfx').onclick = close; m.onclick = (e) => { if (e.target === m) close(); };
  $('#tfs').onclick = async () => {
    const t = ($('#tfv').value || S.token).trim(); const b = $('#tfs'); b.disabled = true; b.textContent = 'Checking…';
    let ok = false; try { ok = await canWrite(t); } catch {}
    if (!ok) { $('#tfe').textContent = 'Still can’t write to sapna-app-and-admin with this token. GitHub changes apply instantly — check the repo is selected and Contents is “Read and write”.'; b.disabled = false; b.textContent = then ? 'Check again & publish' : 'Check & save token'; return; }
    S.token = t; try { localStorage.setItem(LS_TOKEN, t); } catch {}
    close(); toast(then ? 'Token works — publishing…' : 'Token works — saved on this device'); then && then();
  };
}

async function publish() {
  const btn = $('#pubBtn'); btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    const latest = await gh(`contents/${CONTENT_PATH}?ref=${REPO.branch}`);
    const c = { ...S.content, version: (S.content.version || 0) + 1, updatedAt: new Date().toISOString() };
    // drop exercises no plan uses any more, keep the file small
    const used = new Set(c.plans.flatMap((p) => p.moves.map((m) => m.exId)));
    c.exercises = c.exercises.filter((e) => used.has(e.id));
    const body = { message: `Admin: publish plans & foods (${new Date().toISOString().slice(0, 10)})`, content: b64(JSON.stringify(c, null, 1) + '\n'), branch: REPO.branch };
    if (latest?.sha) body.sha = latest.sha;
    const r = await gh(`contents/${CONTENT_PATH}`, { method: 'PUT', body: JSON.stringify(body) });
    S.content = c; S.sha = r.content.sha; S.dirty = false; renderPub();
    toast('Published');
    notifyPublished(c);
  } catch (e) {
    const m = String(e.message || '');
    if (/not accessible by personal access token|Resource not accessible|403/i.test(m)) {
      askToken('The token saved on this device can read the app repo but isn’t allowed to change it.', publish);
    } else if (/Bad credentials|401/i.test(m)) {
      askToken('GitHub rejected the token saved on this device (expired or deleted). Paste a new one.', publish);
    } else if (/sha|conflict|409/i.test(m)) {
      toastLong('The file changed on GitHub since this page loaded. Reload the page and redo the last change.');
    } else toast('Publish failed: ' + m);
  }
  btn.disabled = false; btn.textContent = 'Publish';
}
$('#pubBtn').onclick = publish;

async function loadLib() {
  if (S.lib) return S.lib;
  const r = await fetch(LIB_URL).catch(() => null);
  const j = r && r.ok ? await r.json() : { gifs: [] };
  S.lib = j.gifs.map((g) => ({ id: g.id, name: g.name, group: g.group, part: g.bodyPart, equipment: g.equipment, gif: g.path, aliases: (g.aliases || []).join(' ') }));
  return S.lib;
}

/* ---------------- Views ---------------- */
function app(html) { $('#app').innerHTML = html; }

function viewSetup(err = '') {
  app(`<div class="stack" style="gap:18px;max-width:520px">
    <p class="eyebrow">Sapna Health</p><h1>Admin</h1>
    <div class="card stack" style="border-color:color-mix(in srgb,var(--acc) 45%,transparent)"><strong>Already using the admin on another device?</strong><p class="small muted">There: <b>Targets → Link another device</b>, then scan the QR with this device’s camera. Everything is set up — skip the rest of this page.</p></div>
    <p class="muted">First time? Paste a GitHub token so this page can publish plans to Sapna's app. It's saved only in this browser.</p>
    <div class="card stack small muted"><strong style="color:var(--text)">Make the token once (2 min)</strong>
      <span>GitHub → Settings → Developer settings → <b>Fine-grained tokens</b> → Generate.</span>

/* --- Her dashboard (opens the file she shares; stays in this browser) --- */
const MEAL_ORDER = ['breakfast', 'lunch', 'snacks', 'dinner'];
const MEAL_LABEL = { breakfast: 'Breakfast', lunch: 'Lunch', snacks: 'Snacks', dinner: 'Dinner' };
const dkey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dparse = (k) => new Date(k + 'T12:00:00');
const dadd = (k, n) => { const d = dparse(k); d.setDate(d.getDate() + n); return dkey(d); };
const dlabel = (k, o = { weekday: 'short', day: 'numeric', month: 'short' }) => dparse(k).toLocaleDateString('en-IN', o);
const n0 = (x) => Math.round(x || 0).toLocaleString('en-IN');
const r1 = (x) => Math.round((x || 0) * 10) / 10;
if (!S.dash) S.dash = { range: '7', day: null };

/** v1 (7-day summary) and v2 (full history) files → one shape. */
function normReport(r) {
  const T = r.targets || S.content?.targets || { kcal: 1300, protein: 100, water: 8 };
  let food = [], water = {}, steps = {}, sessions = [];
  const daily = {};
  const day = (k) => daily[k] || (daily[k] = { kcal: 0, protein: 0, items: 0 });
  if ((r.v || 1) >= 2) {
    food = r.food || []; water = r.water || {}; steps = r.steps || {}; sessions = r.sessions || [];
    food.forEach((f) => { const x = day(f.date); x.kcal += f.kcal || 0; x.protein += f.protein || 0; x.items++; });
  } else {
    (r.days || []).forEach((d) => {
      water[d.date] = d.water; steps[d.date] = d.steps;
      const x = day(d.date); x.kcal = d.kcal; x.protein = d.protein;
      MEAL_ORDER.forEach((m) => (d.meals?.[m] || []).forEach((n) => { food.push({ date: d.date, meal: m, name: n }); x.items++; }));
    });
    sessions = (r.workouts || []).map((w) => ({ date: w.date, title: w.title, minutes: w.minutes, sets: w.sets || [], done: [] }));
  }
  Object.values(daily).forEach((x) => { x.kcal = Math.round(x.kcal); x.protein = r1(x.protein); });
  const last = dkey(new Date(r.generatedAt || Date.now()));
  const keys = [...Object.keys(daily), ...Object.keys(water), ...Object.keys(steps), ...sessions.map((s) => s.date), ...(r.weighIns || []).map((w) => w.date)].filter((k) => k <= last).sort();
  const first = keys[0] || last;
  return { r, T, food, water, steps, sessions, daily, burned: r.burned || {}, weighIns: (r.weighIns || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1)), first, last };
}

function rangeDays(m) {
  const span = S.dash.range === 'all' ? null : +S.dash.range;
  const from = span ? dadd(m.last, -(span - 1)) : m.first;
  const out = []; for (let k = from; k <= m.last && out.length < 800; k = dadd(k, 1)) out.push(k);
  return out;
}

/** Bars (HTML, not SVG: crisp on iPhone, rounded tops, 2px gaps). Weekly averages when the range is long. */
function barChart(id, m, days, valueOf, goal, opts = {}) {
  let pts = days.map((k) => ({ k, v: valueOf(k), label: dlabel(k) }));
  if (pts.length > 45) {
    const weeks = [];
    for (let i = 0; i < pts.length; i += 7) {
      const w = pts.slice(i, i + 7); const vals = w.filter((p) => p.v > 0);
      weeks.push({ k: w[0].k, v: vals.length ? vals.reduce((s, p) => s + p.v, 0) / vals.length : 0, label: 'Week of ' + dlabel(w[0].k, { day: 'numeric', month: 'short' }), week: true });
    }
    pts = weeks;
  }
  const max = Math.max(goal ? goal * 1.25 : 0, ...pts.map((p) => p.v), 1);
  const over = (v) => opts.overIsBad && goal && v > goal * 1.1;
  const sel = S.dash.day;
  const bars = pts.map((p) => `<button type="button" class="cbar${over(p.v) ? ' over' : ''}${!p.week && p.k === sel ? ' sel' : ''}${p.v ? '' : ' zero'}" data-day="${p.week ? '' : p.k}" data-tip="${esc(p.label)} · ${opts.fmt ? opts.fmt(p.v) : n0(p.v)}" aria-label="${esc(p.label)}: ${opts.fmt ? opts.fmt(p.v) : n0(p.v)}" style="height:${Math.max(p.v ? 3 : 2, (p.v / max) * 100)}%"></button>`).join('');
  const goalLine = goal ? `<div class="cgoal" style="bottom:${(goal / max) * 100}%"><span>${opts.fmt ? opts.fmt(goal) : n0(goal)}</span></div>` : '';
  const step = Math.max(1, Math.ceil(pts.length / 7));
  const labels = pts.map((p, i) => `<span>${i % step === 0 ? esc(p.week ? dlabel(p.k, { day: 'numeric', month: 'short' }) : pts.length <= 8 ? dlabel(p.k, { weekday: 'short' }) : dlabel(p.k, { day: 'numeric', month: 'short' })) : ''}</span>`).join('');
  return `<div class="chart" id="${id}"><p class="ctip small muted" aria-live="polite">${pts.some((p) => p.week) ? 'Weekly averages · tap a bar' : 'Tap a bar to open that day'}</p>
    <div class="cplot">${goalLine}<div class="cbars" style="grid-template-columns:repeat(${pts.length},minmax(0,1fr))">${bars}</div></div>
    <div class="clabels" style="grid-template-columns:repeat(${pts.length},minmax(0,1fr))">${labels}</div></div>`;
}

function weightChart(m) {
  const ws = m.weighIns; if (ws.length < 2) return '';
  const W = 320, H = 130, P = 10;
  const vs = ws.map((w) => w.kg); const lo = Math.min(...vs) - 0.5, hi = Math.max(...vs) + 0.5;
  const t0 = dparse(ws[0].date).getTime(), t1 = dparse(ws[ws.length - 1].date).getTime() || t0 + 1;
  const x = (k) => P + ((dparse(k).getTime() - t0) / Math.max(1, t1 - t0)) * (W - 2 * P);
  const y = (v) => P + (1 - (v - lo) / (hi - lo)) * (H - 2 * P);
  const pts = ws.map((w) => `${x(w.date).toFixed(1)},${y(w.kg).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="wchart" role="img" aria-label="Weight: ${ws.map((w) => `${dlabel(w.date)} ${w.kg} kg`).join(', ')}">
    <line x1="${P}" x2="${W - P}" y1="${y(hi - 0.5)}" y2="${y(hi - 0.5)}" class="grid"/><line x1="${P}" x2="${W - P}" y1="${y(lo + 0.5)}" y2="${y(lo + 0.5)}" class="grid"/>
    <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${ws.map((w) => `<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="4" fill="var(--acc)" stroke="var(--bg)" stroke-width="2"><title>${esc(dlabel(w.date))} · ${w.kg} kg</title></circle>`).join('')}
    <text x="${W - P}" y="${y(hi - 0.5) - 3}" text-anchor="end" class="axis">${r1(hi - 0.5)} kg</text><text x="${W - P}" y="${y(lo + 0.5) + 11}" text-anchor="end" class="axis">${r1(lo + 0.5)} kg</text>
  </svg>`;
}

/* --- Live sync: her app writes an encrypted dashboard to a PRIVATE repo; we decrypt it here --- */
const LS_SYNC = 'sapna_admin_sync_v1';
const SYNC_FILE = 'dashboard.enc.json';
if (!S.sync) S.sync = { status: 'idle' };
const b64u = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = (s) => { const bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); const o = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i); return o; };
function syncCfg() { try { return JSON.parse(localStorage.getItem(LS_SYNC) || 'null'); } catch { return null; } }
function tokenShapeError(t) {
  if (!t) return 'Paste the token first.';
  if (/\s/.test(t)) return 'The token has a space or line break in it — copy it again with GitHub’s copy button.';
  if (t.startsWith('github_pat_') && t.length !== 93) return `That token is ${t.length} characters; GitHub tokens are 93. It was probably cut off — copy it again with GitHub’s copy button.`;
  if (!/^(github_pat_|ghp_)/.test(t)) return 'Paste the token that starts with github_pat_';
  return '';
}
function pairingCode(c) { return 'SAPNA-SYNC-1:' + b64u(new TextEncoder().encode(JSON.stringify({ o: c.o, r: c.r, b: c.b, t: c.t, k: c.k }))); }
function parsePairing(code) { const m = String(code).trim().match(/SAPNA-SYNC-1:([A-Za-z0-9_-]+)/); if (!m) return null; try { const j = JSON.parse(new TextDecoder().decode(unb64u(m[1]))); return j.o && j.r && j.t && j.k ? { o: j.o, r: j.r, b: j.b || 'main', t: j.t, k: j.k } : null; } catch { return null; } }
async function syncGh(c, path, accept = 'application/vnd.github+json') {
  return fetch(`https://api.github.com/repos/${c.o}/${c.r}${path}`, { headers: { Authorization: `Bearer ${c.t}`, Accept: accept, 'X-GitHub-Api-Version': '2022-11-28' }, cache: 'no-store' });
}
async function fetchSync() {
  const c = syncCfg(); if (!c) return;
  S.sync = { ...S.sync, status: 'loading' };
  try {
    const path = `/contents/${SYNC_FILE}?ref=${encodeURIComponent(c.b)}&t=${Date.now()}`;
    let res = await syncGh(c, path, 'application/vnd.github.raw');
    // Sync token dead? Reading also works with Rishu's main admin token if it covers the sync repo.
    if ((res.status === 401 || res.status === 404) && S.token && S.token !== c.t) {
      const alt = await syncGh({ ...c, t: S.token }, path, 'application/vnd.github.raw');
      if (alt.ok) { res = alt; S.syncTokenDead = true; }
    } else if (res.ok) S.syncTokenDead = false;
    if (res.status === 404) { S.sync = { status: 'empty', fetchedAt: Date.now() }; return; }
    if (res.status === 401) { S.syncTokenDead = true; throw new Error('The sync token stopped working (expired, deleted or regenerated). Tap “Update token”, paste the current token, and send Sapna the new code.'); }
    if (!res.ok) throw new Error(`GitHub ${res.status}`);
    const env = JSON.parse(await res.text());
    if (env.type !== 'sapna-sync') throw new Error('Unexpected file in the sync repo.');
    const key = await crypto.subtle.importKey('raw', unb64u(c.k), 'AES-GCM', false, ['decrypt']);
    let bytes;
    try { bytes = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64u(env.iv) }, key, unb64u(env.ct))); }
    catch { throw new Error('Can’t unlock her data with this browser’s key. Paste the pairing code she is using (Live sync → Use an existing code).'); }
    if (env.z) bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    const rep = JSON.parse(new TextDecoder().decode(bytes));
    S.syncReport = rep; S.sync = { status: 'ok', fetchedAt: Date.now(), at: env.at };
  } catch (e) {
    S.sync = { status: 'error', msg: e.message || 'Could not reach GitHub', fetchedAt: Date.now() };
  }
}
function currentReport() {
  const a = S.syncReport, b = S.report;
  if (a && b) return new Date(b.generatedAt) > new Date(a.generatedAt) ? b : a;
  return a || b || null;
}

/* --- Push to her phone (Firebase Cloud Messaging) ---
   Default route: GitHub workflow "Push to Sapna" (holds the Firebase key as a secret; ~15–30 s).
   Optional instant route: the service-account key pasted here (stays in this browser; ~1 s). */
const LS_FCM = 'sapna_admin_fcm_sa';
const LS_AUTOPUSH = 'sapna_admin_autopush';
const fcmSa = () => { try { return JSON.parse(localStorage.getItem(LS_FCM) || 'null'); } catch { return null; } };
const autoPush = () => { try { return localStorage.getItem(LS_AUTOPUSH) !== '0'; } catch { return true; } };
function herPush() { const r = S.syncReport || S.report; return r && r.push && r.push.token ? r.push : null; }

async function fcmDirect(sa, msg) {
  const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const now = Math.floor(Date.now() / 1000);
  const unsigned = enc({ alg: 'RS256', typ: 'JWT' }) + '.' + enc({ iss: sa.client_email, scope: 'https://www.googleapis.com/auth/firebase.messaging', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 });
  const der = Uint8Array.from(atob(sa.private_key.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '')), (c) => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(unsigned)));
  const jwt = unsigned + '.' + b64u(sig);
  const tr = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }) });
  const tj = await tr.json(); if (!tr.ok) throw new Error('Google sign-in failed: ' + (tj.error_description || tj.error));
  const r = await fetch(`https://fcm.googleapis.com/v1/projects/${sa.project_id}/messages:send`, { method: 'POST', headers: { Authorization: `Bearer ${tj.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(msg) });
  const rj = await r.json().catch(() => ({})); if (!r.ok) throw new Error('FCM: ' + (rj.error?.message || r.status));
}

/** Returns 'instant' | 'queued'. Throws with a readable message. */
async function sendPush(title, body, data = {}) {
  const p = herPush();
  if (!p) throw new Error('Her phone hasn’t registered for notifications yet — she needs app 1.7 and to open it once with live sync on.');
  const strData = Object.fromEntries(Object.entries(data).map(([k, v]) => [k, String(v)]));
  const sa = fcmSa();
  if (sa) {
    try {
      await fcmDirect(sa, { message: { token: p.token, notification: { title, body }, data: strData, android: { priority: 'HIGH', notification: { channel_id: 'rishu', icon: 'ic_stat_sapna', color: '#FF7A59', sound: 'default' } } } });
      return 'instant';
    } catch (e) { console.warn('Instant push failed, using GitHub route:', e.message); }
  }
  await gh('dispatches', { method: 'POST', body: JSON.stringify({ event_type: 'sapna-push', client_payload: { token: p.token, title, body, data: strData } }) });
  return 'queued';
}
const sentMsg = (how) => (how === 'instant' ? 'Sent — she has it now' : 'Sent — reaches her phone in ~20 s');

}

    ${p ? `<textarea class="input" id="pnote" maxlength="180" placeholder="e.g. Proud of you — don’t skip leg day 😄"></textarea>

      : `<p class="small muted">Once she installs app 1.7 and opens it with live sync on, you can ping her here — and every Publish tells her automatically.</p>`}
  </div>`;
}

function vSyncCard(c) {
  const code = pairingCode(c);
  return `<div class="card stack"><div class="between"><h2>Live sync</h2><span class="pill">${esc(c.o)}/${esc(c.r)}</span></div>
    ${S.showPair ? `<p class="small muted">Send this to Sapna. In her app: <b>Settings → Live sync with Rishu → paste → Connect</b>. It contains the key to her data — share it only with her.</p>
      <textarea class="input mono" id="pcode" readonly>${esc(code)}</textarea>
      <div class="row wrapr"><button class="btn sm" type="button" id="pcopy">Copy code</button>${navigator.share ? '<button class="btn ghost sm" type="button" id="pshare">Share…</button>' : ''}<button class="btn ghost sm" type="button" id="phide">Hide</button></div>`
      : `<div class="row wrapr"><button class="btn sm" type="button" data-link>Link another device</button><button class="btn ghost sm" type="button" id="pshow">Show pairing code</button><button class="btn ghost sm" type="button" id="supd">Update token</button><button class="btn danger sm" type="button" id="soff">Disconnect this browser</button></div>`}
    ${S.syncTokenDead || S.showUpd ? `<div class="card warn stack" style="gap:8px"><strong>Update the sync token</strong>
      <p class="small muted">Paste the current value of your token that has <b>sapna-sync</b> with Contents: Read and write. Her encryption key stays the same — she just pastes the new code (Settings → Live sync → Paste new code).</p>
      <input class="input" id="sutok" type="password" autocomplete="off" placeholder="github_pat_…">
      <button class="btn sm" type="button" id="susave" style="align-self:flex-start">Check & make new code</button></div>` : ''}
  </div>`;
}
const emergencyFile = () => `<details class="card"><summary><strong>Emergency: open a file</strong> <span class="small muted">only if sync isn’t working</span></summary><div class="stack" style="margin-top:10px"><p class="small muted">If she taps “Send my dashboard file” in her app’s Settings and sends it on WhatsApp, open it here. It stays in this browser.</p><label class="btn ghost sm" style="cursor:pointer;align-self:flex-start">Open file<input id="rep" type="file" accept="application/json,text/plain,.json,.txt" class="sr"></label></div></details>`;

function vStatus() {
  const c = syncCfg();
  const rep = currentReport();
  const tail = (c ? vSyncCard(c) : '') + emergencyFile();
  if (!rep) {
    const st = S.sync;
    const msg = !c ? '' : st.status === 'error' ? `<div class="card warn"><strong>Sync problem</strong><p class="small muted">${esc(st.msg)}</p><button class="btn ghost sm" type="button" id="srefresh">Try again</button></div>`
      : st.status === 'empty' ? `<div class="card"><strong>Waiting for her phone</strong><p class="small muted">Once she pastes the pairing code in her app (Settings → Live sync with Rishu), her dashboard appears here.</p><button class="btn ghost sm" type="button" id="srefresh">Check again</button></div>`
      : `<p class="muted">Loading her dashboard…</p>`;
    if (c && !S.showPairOnce) { S.showPair = true; S.showPairOnce = true; }
    return `<div class="stack" style="gap:16px">${c ? msg + vSyncCard(c) : vSyncSetup()}${emergencyFile()}</div>`;
  }
  return vDash(rep, c) + `<div class="stack" style="gap:16px;margin-top:16px">${tail}</div>`;
}

function vDash(rep, c) {
  const fromSync = rep === S.syncReport;
  const m = normReport(rep);
  const T = m.T;
  if (!S.dash.day || S.dash.day > m.last || S.dash.day < m.first) S.dash.day = m.last;
  const days = rangeDays(m);
  const logged = days.filter((k) => m.daily[k]?.kcal > 0);
  const avg = (f) => (logged.length ? logged.reduce((s, k) => s + f(k), 0) / logged.length : 0);
  const onT = logged.filter((k) => Math.abs(m.daily[k].kcal - T.kcal) <= T.kcal * 0.1).length;
  const protHit = logged.filter((k) => m.daily[k].protein >= T.protein * 0.9).length;
  const sess = m.sessions.filter((s) => s.date >= days[0] && s.date <= m.last).sort((a, b) => (a.date < b.date ? 1 : -1));
  const mins = sess.reduce((s, x) => s + (x.minutes || 0), 0);
  const wNow = m.weighIns.at(-1), wStart = m.r.profile?.startKg ?? m.weighIns[0]?.kg;
  const ageH = (Date.now() - new Date(m.r.generatedAt).getTime()) / 3600000;
  const fresh = ageH < 1 ? 'just now' : ageH < 24 ? `${Math.round(ageH)} h ago` : `${Math.round(ageH / 24)} days ago`;
  const stale = ageH > 48 ? `<div class="card warn"><strong>Last update ${Math.round(ageH / 24)} days ago.</strong><p class="small muted">${fromSync ? 'Her phone syncs whenever she opens the app — she may not have opened it.' : 'This is an old file.'}${S.sync.status === 'error' ? ' Sync error: ' + esc(S.sync.msg) : ''}</p></div>` : (S.sync.status === 'error' && c ? `<div class="card warn small"><strong>Sync problem:</strong> ${esc(S.sync.msg)}</div>` : '');
  const v1 = (m.r.v || 1) < 2 ? `<div class="card warn small">Older 7-day file — calories per food item and full history need her app updated to 1.5.3+.</div>` : '';

  // --- day detail
  const k = S.dash.day; const dd = m.daily[k] || { kcal: 0, protein: 0, items: 0 };
  const burnK = m.burned[k] || 0;
  const items = m.food.filter((f) => f.date === k).sort((a, b) => (a.at || 0) - (b.at || 0));
  const meals = MEAL_ORDER.map((ml) => {
    const its = items.filter((f) => f.meal === ml); if (!its.length) return '';
    const sum = its.reduce((s, f) => s + (f.kcal || 0), 0);
    return `<div class="meal"><div class="between"><strong>${MEAL_LABEL[ml]}</strong><span class="small muted">${sum ? n0(sum) + ' kcal' : ''}</span></div>
      ${its.map((f) => `<div class="fi"><span>${esc(f.name)}${f.mult && f.mult !== 1 ? ` <span class="muted">×${f.mult}</span>` : ''}${f.portion ? `<span class="faint small"> · ${esc(f.portion)}</span>` : ''}</span><span class="small muted">${f.kcal != null ? `${n0(f.kcal)} kcal · ${r1(f.protein)} g` : ''}${f.at ? ` · ${new Date(f.at).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })}` : ''}</span></div>`).join('')}</div>`;
  }).join('');
  const daySess = m.sessions.filter((s) => s.date === k);
  const dayCard = `<div class="card stack" id="daycard">
    <div class="between"><button class="ib" type="button" data-dnav="-1" aria-label="Previous day" ${k <= m.first ? 'disabled' : ''}>‹</button>
      <div style="text-align:center"><p class="eyebrow">Day detail</p><h2>${esc(dlabel(k, { weekday: 'long', day: 'numeric', month: 'short' }))}</h2></div>
      <button class="ib" type="button" data-dnav="1" aria-label="Next day" ${k >= m.last ? 'disabled' : ''}>›</button></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
      <div><p class="eyebrow">Eaten</p><p class="big" style="font-size:24px">${n0(dd.kcal)}</p><p class="small muted">of ${n0(T.kcal + Math.round(burnK / 2))} kcal</p></div>
      <div><p class="eyebrow">Protein</p><p class="big" style="font-size:24px">${r1(dd.protein)} g</p><p class="small muted">goal ${T.protein} g</p></div>
      <div><p class="eyebrow">Water</p><p class="big" style="font-size:24px">${m.water[k] || 0}</p><p class="small muted">of ${T.water || 8} glasses</p></div>
      <div><p class="eyebrow">Steps</p><p class="big" style="font-size:24px">${n0(m.steps[k])}</p><p class="small muted">${burnK ? `${n0(burnK)} kcal burned` : '—'}</p></div>
    </div>
    <div class="bar" role="img" aria-label="${dd.kcal} of ${T.kcal} kcal"><i style="width:${Math.min(100, (dd.kcal / T.kcal) * 100)}%;${dd.kcal > T.kcal * 1.1 ? 'background:var(--danger)' : ''}"></i></div>
    ${meals || '<p class="muted">Nothing logged this day.</p>'}
    ${daySess.map((s) => `<div class="meal" style="--acc:var(--amber)"><div class="between"><strong>🏋️ ${esc(s.title)}</strong><span class="small muted">${s.minutes || '?'} min${s.kcal ? ` · ${n0(s.kcal)} kcal` : ''}</span></div>${sessBody(s)}</div>`).join('')}
  </div>`;

  // --- strength: first vs latest best per lift
  const lifts = {};
  m.sessions.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((s) => {
    const best = {}; (s.sets || []).forEach((x) => { if (x.kg > 0) best[x.name] = Math.max(best[x.name] || 0, x.kg); });
    Object.entries(best).forEach(([n, kg]) => { const L = lifts[n] || (lifts[n] = { first: kg, firstDate: s.date, last: kg, top: kg, n: 0 }); L.last = kg; L.top = Math.max(L.top, kg); L.n++; });
  });
  const liftRows = Object.entries(lifts).sort((a, b) => b[1].n - a[1].n).slice(0, 12);

  // --- food habits in range
  const inR = m.food.filter((f) => f.date >= days[0]);
  const cnt = {}; inR.forEach((f) => { const c = cnt[f.name] || (cnt[f.name] = { n: 0, kcal: 0 }); c.n++; c.kcal += f.kcal || 0; });
  const top = Object.entries(cnt).sort((a, b) => b[1].n - a[1].n).slice(0, 8);
  const mealK = MEAL_ORDER.map((ml) => [ml, inR.filter((f) => f.meal === ml).reduce((s, f) => s + (f.kcal || 0), 0)]);
  const mealTot = mealK.reduce((s, x) => s + x[1], 0);
  const missing = days.filter((k) => !(m.daily[k]?.items > 0)).length;

  const tips = [];
  if (logged.length && protHit < logged.length / 2) tips.push(['Protein is the gap', `Hit 90%+ of ${T.protein} g on only ${protHit} of ${logged.length} logged days.`]);
  if (missing > 1) tips.push(['Days not logged', `${missing} of ${days.length} days have no food logged.`]);
  if (logged.length && avg((k) => m.daily[k].kcal) > T.kcal * 1.12) tips.push(['Running over', `Averaging ${n0(avg((k) => m.daily[k].kcal))} kcal vs a ${n0(T.kcal)} target.`]);

  const cyc = m.r.cycle ? `<div class="card" style="--acc:var(--pink)"><p class="eyebrow" style="color:var(--pink)">Cycle · shared by her</p><p class="big" style="font-size:24px;margin-top:6px">${esc(m.r.cycle.phase)} · day ${esc(m.r.cycle.day)}</p><p class="small muted">${m.r.cycle.daysToNext >= 0 ? `Next period in about ${m.r.cycle.daysToNext} days` : `Period ${-m.r.cycle.daysToNext} days late`}</p></div>` : '';

  return `<div class="stack dash" style="gap:16px">
    <div class="between wrapr"><p class="muted small">${fromSync ? '<span class="live"></span>Live from her phone' : 'From a file'} · updated ${fresh}${m.r.streaks ? ` · logging streak <b>${m.r.streaks.logging}</b> · workout streak <b>${m.r.streaks.workout}</b>` : ''}</p>${c ? `<button class="btn ghost sm" type="button" id="srefresh">${S.sync.status === 'loading' ? 'Refreshing…' : 'Refresh'}</button>` : ''}</div>
    ${stale}${v1}
    ${m.r.activeSession && m.r.activeSession.startedAt > Date.now() - 4 * 3600000 ? `<div class="card" style="--acc:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)"><p class="eyebrow" style="color:var(--amber)"><span class="live" style="background:var(--amber);box-shadow:0 0 8px var(--amber)"></span>At the gym now</p><p class="big" style="font-size:22px;margin-top:6px">${esc(m.r.activeSession.title)}</p><p class="small muted">Started ${new Date(m.r.activeSession.startedAt).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' })} · ${m.r.activeSession.done.length} moves done${m.r.activeSession.done.length ? ': ' + esc(m.r.activeSession.done.join(', ')) : ''}</p></div>` : ''}
    ${c ? vPushCard() : ''}
    <div class="chips" role="group" aria-label="Range">${[['7', '7 days'], ['30', '30 days'], ['all', 'All time']].map(([v, l]) => `<button class="chip" type="button" data-range="${v}" aria-pressed="${S.dash.range === v}">${l}</button>`).join('')}</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="card"><p class="eyebrow">Avg calories</p><p class="big" style="font-size:30px">${n0(avg((k) => m.daily[k].kcal))}</p><p class="small muted">target ${n0(T.kcal)} · ${logged.length} days logged</p></div>
      <div class="card"><p class="eyebrow">Avg protein</p><p class="big" style="font-size:30px">${n0(avg((k) => m.daily[k].protein))} g</p><p class="small muted">goal ${T.protein} g · hit ${protHit}×</p></div>
      <div class="card"><p class="eyebrow">On target</p><p class="big" style="font-size:30px">${onT}/${logged.length}</p><p class="small muted">days within ±10%</p></div>
      <div class="card"><p class="eyebrow">Workouts</p><p class="big" style="font-size:30px">${sess.length}</p><p class="small muted">${n0(mins)} min · ${n0(sess.reduce((s, x) => s + (x.kcal || 0), 0))} kcal</p></div>
      <div class="card"><p class="eyebrow">Weight</p><p class="big" style="font-size:30px">${wNow ? r1(wNow.kg) + ' kg' : '—'}</p><p class="small muted">${wNow && wStart ? `${wNow.kg - wStart > 0 ? '+' : ''}${r1(wNow.kg - wStart)} kg since start` : 'no weigh-ins yet'}</p></div>
      <div class="card"><p class="eyebrow">Avg steps</p><p class="big" style="font-size:30px">${n0(days.reduce((s, k) => s + (m.steps[k] || 0), 0) / Math.max(1, days.filter((k) => m.steps[k] > 0).length))}</p><p class="small muted">on days logged</p></div>
    </div>
    ${tips.length ? `<div class="stack"><h2>Needs attention</h2>${tips.map(([t, b]) => `<div class="card warn"><strong>${esc(t)}</strong><p class="small muted">${esc(b)}</p></div>`).join('')}</div>` : ''}
    <div class="card stack"><div class="between"><h2>Calories</h2><span class="small muted">dashed = ${n0(T.kcal)} target · red = 10%+ over</span></div>${barChart('ch-kcal', m, days, (k) => m.daily[k]?.kcal || 0, T.kcal, { overIsBad: true })}</div>
    ${dayCard}
    <div class="card stack"><div class="between"><h2>Protein</h2><span class="small muted">dashed = ${T.protein} g goal</span></div>${barChart('ch-prot', m, days, (k) => m.daily[k]?.protein || 0, T.protein, { fmt: (v) => n0(v) + ' g' })}</div>
    <div class="card stack"><h2>Steps</h2>${barChart('ch-steps', m, days, (k) => m.steps[k] || 0, 0)}</div>
    ${m.weighIns.length >= 2 ? `<div class="card stack"><div class="between"><h2>Weight</h2><span class="small muted">${m.weighIns.length} weigh-ins</span></div>${weightChart(m)}</div>` : ''}
    ${cyc}
    <div class="card stack"><div class="between"><h2>Workout sessions</h2><span class="small muted">${sess.length} in range</span></div>
      ${sess.length ? sess.map((s) => `<details class="sess"><summary><span><strong>${esc(s.title)}</strong><span class="small muted" style="display:block">${esc(dlabel(s.date))} · ${s.minutes || '?'} min${s.kcal ? ` · ${n0(s.kcal)} kcal` : ''} · ${(s.done || []).length || new Set((s.sets || []).map((x) => x.name)).size} moves</span></span><span class="pill">${(s.sets || []).length} sets</span></summary>${sessBody(s)}</details>`).join('') : '<p class="muted">No workouts in this range.</p>'}</div>
    ${liftRows.length ? `<div class="card stack"><h2>Strength progress</h2><table><thead><tr><th>Lift</th><th>First</th><th>Now</th><th>Best</th></tr></thead><tbody>${liftRows.map(([n, L]) => `<tr><td>${esc(n)}</td><td>${L.first} kg</td><td>${L.last} kg${L.last > L.first ? ` <span class="ok">+${r1(L.last - L.first)}</span>` : ''}</td><td>${L.top} kg</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${inR.length ? `<div class="card stack"><h2>Food habits</h2>
      <p class="eyebrow">Calories by meal</p>${mealK.map(([ml, v]) => `<div class="mrow"><span>${MEAL_LABEL[ml]}</span><div class="bar"><i style="width:${mealTot ? (v / mealTot) * 100 : 0}%"></i></div><span class="small muted">${mealTot ? Math.round((v / mealTot) * 100) : 0}%</span></div>`).join('')}
      <p class="eyebrow" style="margin-top:6px">Most logged</p>${top.map(([n, c]) => `<div class="between"><span>${esc(n)}</span><span class="small muted">${c.n}×${c.kcal ? ` · ~${n0(c.kcal / c.n)} kcal` : ''}</span></div>`).join('')}</div>` : ''}
    ${m.r.reminders || m.r.profile ? `<details class="card"><summary><strong>Her settings</strong> <span class="small muted">as set on her phone</span></summary><div class="stack small" style="gap:6px;margin-top:10px">
      ${m.r.profile ? `<div class="between"><span class="muted">Goal · diet</span><span>${esc(m.r.goal || '—')} · ${esc(m.r.profile.diet || '—')}</span></div>
      <div class="between"><span class="muted">Gym days</span><span>${(m.r.profile.gymDays || []).map((d) => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ') || 'none picked'}</span></div>
      <div class="between"><span class="muted">Height · start weight</span><span>${m.r.profile.heightCm || '—'} cm · ${m.r.profile.startKg || '—'} kg</span></div>
      ${m.r.profile.avoid ? `<div class="between"><span class="muted">Avoids</span><span>${esc(m.r.profile.avoid)}</span></div>` : ''}` : ''}
      ${m.r.reminders ? `<div class="between"><span class="muted">Reminders on</span><span>${Object.entries(m.r.reminders).filter(([k, v]) => v === true).map(([k]) => ({ punch: 'gym punch line', meals: 'meals', water: 'water', gym: 'workout days', weigh: 'weigh-in', steps: 'night steps' }[k] || k)).join(', ') || 'none'}</span></div>` : ''}
      ${(m.r.customFoods || []).length ? `<div class="between"><span class="muted">Her own foods</span><span>${m.r.customFoods.length}</span></div>` : ''}
    </div></details>` : ''}
    <details class="card"><summary><strong>Table view</strong> <span class="small muted">every day in range</span></summary><div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>Day</th><th>kcal</th><th>Protein</th><th>Water</th><th>Steps</th><th>Burned</th><th>Gym</th></tr></thead><tbody>
      ${days.slice().reverse().map((k) => `<tr data-day="${k}" class="trow"><td>${esc(dlabel(k))}</td><td${(m.daily[k]?.kcal || 0) > T.kcal * 1.1 ? ' class="bad"' : ''}>${m.daily[k]?.kcal ? n0(m.daily[k].kcal) : '—'}</td><td>${m.daily[k]?.protein ? r1(m.daily[k].protein) + ' g' : '—'}</td><td>${m.water[k] || '—'}</td><td>${m.steps[k] ? n0(m.steps[k]) : '—'}</td><td>${m.burned[k] ? n0(m.burned[k]) : '—'}</td><td>${m.sessions.some((s) => s.date === k) ? '✓' : ''}</td></tr>`).join('')}
    </tbody></table></div></details>
  </div>`;
}

function sessBody(s) {
  const by = {}; (s.sets || []).forEach((x) => (by[x.name] = by[x.name] || []).push(x));
  return `<div class="stack small" style="gap:6px;margin-top:8px">${Object.entries(by).map(([n, sets]) => `<div class="between"><span>${esc(n)}</span><span class="muted">${sets.map((x) => (x.kg ? `${x.kg}×${x.reps}` : `${x.reps}`)).join(' · ')}</span></div>`).join('') || '<span class="muted">No sets recorded.</span>'}</div>`;
}

function wireStatus() {
  const c = syncCfg();
  if (!c && S.token && S.syncExists === undefined) {
    S.syncExists = null; // checking
    fetch('https://api.github.com/repos/drishabhh/sapna-sync/contents/dashboard.enc.json', { headers: { Authorization: `Bearer ${S.token}`, Accept: 'application/vnd.github+json' }, cache: 'no-store' })
      .then((r) => { S.syncExists = r.ok; if (r.ok && S.tab === 'status') render(); }).catch(() => { S.syncExists = false; });
  }
  document.querySelectorAll('[data-link]').forEach((b) => (b.onclick = showLink));
  const ps = $('#psend');
  if (ps) ps.onclick = async () => {
    const msg = $('#pnote').value.trim(); if (!msg) return toast('Write something first');
    ps.disabled = true; ps.textContent = 'Sending…';
    try { toast(sentMsg(await sendPush('Rishu 💌', msg, { kind: 'note', tab: 'today' }))); $('#pnote').value = ''; }
    catch (e) { toastLong(e.message); }
    ps.disabled = false; ps.textContent = 'Send to her phone';
  };
  const refresh = async () => { await fetchSync(); if (S.tab === 'status') { const y = scrollY; render(); scrollTo(0, y); } };
  if (c && S.sync.status !== 'loading' && (!S.sync.fetchedAt || Date.now() - S.sync.fetchedAt > 60000)) refresh();
  const rb = $('#srefresh'); if (rb) rb.onclick = () => { S.sync.fetchedAt = 0; rb.textContent = 'Refreshing…'; refresh(); };
  const mk = $('#smake');
  if (mk) mk.onclick = async () => {
    const [o, r] = $('#sr').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').split('/');
    const t = $('#st').value.trim() || S.token;
    if (!o || !r) return toast('Repo should look like drishabhh/sapna-sync');
    { const bad = tokenShapeError(t); if (bad) return toast(bad); }
    mk.disabled = true; mk.textContent = 'Checking…';
    try {
      const res = await syncGh({ o, r, t }, '');
      const j = await res.json().catch(() => ({}));
      if (res.status === 401) throw new Error('GitHub doesn’t recognise that token — it was regenerated, expired or deleted. Regenerate it on GitHub and paste the new value right away.');
      if (res.status === 404) throw new Error('Repo not found, or the token was not given access to it.');
      if (!res.ok) throw new Error(j.message || `GitHub ${res.status}`);
      if (!j.private) throw new Error('That repo is PUBLIC. Her data must go to a private repo — make it private first.');
      const k = b64u(crypto.getRandomValues(new Uint8Array(32)));
      localStorage.setItem(LS_SYNC, JSON.stringify({ o, r, b: j.default_branch || 'main', t, k }));
      S.showPair = true; S.showPairOnce = true; S.sync = { status: 'idle' }; S.syncReport = null;
      render(); toast('Pairing code ready — send it to Sapna');
    } catch (e) { toast(e.message); mk.disabled = false; mk.textContent = 'Create pairing code'; }
  };
  const use = $('#suse');
  if (use) use.onclick = () => {

    { const bad = tokenShapeError(t); if (bad) return toast(bad); }

      const res = await syncGh({ ...cfg, t }, '');
      if (res.status === 401) throw new Error('GitHub doesn’t recognise that token — it was regenerated, expired or deleted. Regenerate it on GitHub and paste the new value right away.');
      if (res.status === 404) throw new Error('That token has no access to ' + cfg.o + '/' + cfg.r + '.');
      const j = await res.json(); if (!j.private) throw new Error('The sync repo is public — make it private first.');
      const w = await fetch(`https://api.github.com/repos/${cfg.o}/${cfg.r}/git/blobs`, { method: 'POST', headers: { Authorization: `Bearer ${t}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ content: 'write-check', encoding: 'utf-8' }) });

function addExerciseToPlan(ex) {

  const st = ex.group === 'stretching';
  p.moves.push({ exId: ex.id, sets: st ? 1 : 3, reps: st ? 10 : 12, unit: 'reps' });
  markDirty(); toast(`${ex.name} added`);
}

  $('#logout').onclick = () => { localStorage.removeItem(LS_TOKEN); S.token = ''; viewSetup(); };
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && S.tab === 'status' && syncCfg() && S.content) { S.sync.fetchedAt = 0; render(); } });
// Live: re-check her file every 20 s while the dashboard is on screen; repaint only if it changed.
setInterval(async () => {
  if (document.hidden || S.tab !== 'status' || !S.content || !syncCfg() || S.sync.status === 'loading') return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; // don't disturb typing
  const before = S.sync.at;
  await fetchSync();
  if (S.sync.at !== before || S.sync.status === 'error') { const y = scrollY; render(); scrollTo(0, y); }
}, 20000);
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

async function boot() {
  const linked = sessionStorage.getItem('sapna_admin_linked'); sessionStorage.removeItem('sapna_admin_linked');
  if (linked === '1') setTimeout(() => toast('This device is linked — nothing to paste'), 400);
  if (linked === 'bad') setTimeout(() => toast('That link was incomplete — copy it again'), 400);
  if (!S.token) return viewSetup();
  app('<p class="muted">Loading…</p>');
  try { await loadContent(); render(); }
  catch (e) { viewSetup(e.message); }
}
boot();
</script>
</body>
</html>
