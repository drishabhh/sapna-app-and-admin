name: Push to Sapna

# Triggered by the admin page (repository_dispatch) right after Rishu publishes or sends a note.
# The Firebase service-account key lives only in the FCM_SERVICE_ACCOUNT secret.
# Payload values arrive through env vars (never pasted into the script) and are never printed.

on:
  repository_dispatch:
    types: [sapna-push]

permissions:
  contents: read

concurrency:
  group: sapna-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send via Firebase Cloud Messaging
        env:
          SA: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          DEVICE: ${{ github.event.client_payload.token }}
          TITLE: ${{ github.event.client_payload.title }}
          BODY: ${{ github.event.client_payload.body }}
          DATA: ${{ toJSON(github.event.client_payload.data) }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const fail = (m) => { console.error('::error::' + m); process.exit(1); };
          if (!process.env.SA) fail('FCM_SERVICE_ACCOUNT secret is not set');
          if (!process.env.DEVICE) fail('No device token in the request');
          let sa; try { sa = JSON.parse(process.env.SA); } catch { fail('FCM_SERVICE_ACCOUNT is not valid JSON'); }
          const b64u = (b) => Buffer.from(b).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64u(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const claim = b64u(JSON.stringify({ iss: sa.client_email, scope: 'https://www.googleapis.com/auth/firebase.messaging', aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 }));
          const sig = crypto.createSign('RSA-SHA256').update(`${head}.${claim}`).sign(sa.private_key);
          const jwt = `${head}.${claim}.${b64u(sig)}`;
          const tr = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: jwt }) });
          const tj = await tr.json();
          if (!tr.ok) fail('Google sign-in failed: ' + (tj.error_description || tj.error || tr.status));
          let data = {}; try { data = JSON.parse(process.env.DATA || '{}') || {}; } catch {}
          const strData = Object.fromEntries(Object.entries(data).map(([k, v]) => [k, String(v)]));
          const msg = { message: { token: process.env.DEVICE, notification: { title: process.env.TITLE || 'From Rishu', body: process.env.BODY || '' }, data: strData, android: { priority: 'HIGH', notification: { channel_id: 'rishu', icon: 'ic_stat_sapna', color: '#FF7A59', sound: 'default' } } } };
          const r = await fetch(`https://fcm.googleapis.com/v1/projects/${sa.project_id}/messages:send`, { method: 'POST', headers: { Authorization: `Bearer ${tj.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(msg) });
          const rj = await r.json().catch(() => ({}));
          if (!r.ok) fail('FCM refused: ' + (rj.error?.status || r.status) + ' ' + (rj.error?.message || ''));
          console.log('Sent ✓');
          JS
